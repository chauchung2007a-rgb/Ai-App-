<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AI App Builder</title>

<style>

/* =====================================================
   1. RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#090b10;
  color:#fff;
}


/* =====================================================
   2. APP
===================================================== */

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#090b10;
}


/* =====================================================
   3. HEADER
===================================================== */

.header{
  height:92px;
  flex-shrink:0;
  border-bottom:1px solid #20242d;
  background:#0d1016;
}

.top-row{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.home-btn,
.settings-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:#171b23;
  color:#fff;
  font-size:19px;
  cursor:pointer;
}

.title{
  font-size:15px;
  font-weight:700;
}

.tabs{
  height:49px;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.tab{
  height:40px;
  min-width:85px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#8f96a3;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  background:#1a202b;
  color:#fff;
}


/* =====================================================
   4. MAIN
===================================================== */

.main{
  flex:1;
  min-height:0;
  position:relative;
}

.view{
  position:absolute;
  inset:0;
  display:none;
}

.view.active{
  display:flex;
}


/* =====================================================
   5. AI CHAT
===================================================== */

.chat-view{
  flex-direction:column;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 20px;
}

.welcome{
  text-align:center;
  margin-top:35px;
}

.welcome-icon{
  font-size:42px;
  margin-bottom:12px;
}

.welcome h2{
  font-size:21px;
  margin-bottom:8px;
}

.welcome p{
  color:#858c99;
  font-size:14px;
  line-height:1.6;
}

.message{
  max-width:88%;
  margin-bottom:14px;
  padding:11px 13px;
  border-radius:15px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user{
  margin-left:auto;
  background:#263247;
  border-bottom-right-radius:5px;
}

.message.ai{
  margin-right:auto;
  background:#171b23;
  border-bottom-left-radius:5px;
}

.chat-input-area{
  flex-shrink:0;
  padding:9px 10px 12px;
  border-top:1px solid #20242d;
  background:#0d1016;
}

.attachment-name{
  display:none;
  padding:5px 8px;
  color:#9da5b3;
  font-size:11px;
}

.input-row{
  display:flex;
  align-items:center;
  gap:7px;
}

.attach-btn,
.voice-btn,
.send-btn{
  width:40px;
  height:40px;
  flex-shrink:0;
  border:0;
  border-radius:11px;
  background:#171b23;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.send-btn{
  background:#27364d;
}

.chat-input{
  flex:1;
  min-width:0;
  height:40px;
  border:1px solid #242a35;
  border-radius:12px;
  outline:none;
  padding:0 12px;
  background:#12161d;
  color:#fff;
  font-size:14px;
}

.chat-input::placeholder{
  color:#737b89;
}


/* =====================================================
   6. CODE VIEW
===================================================== */

.code-view{
  flex-direction:column;
  min-height:0;
}

.code-toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:7px;
  padding:7px 9px;
  border-bottom:1px solid #20242d;
  background:#0d1016;
}

.language-select{
  height:36px;
  border:1px solid #272d38;
  border-radius:9px;
  outline:none;
  padding:0 8px;
  background:#151922;
  color:#fff;
  font-size:12px;
}

.tool-btn{
  height:36px;
  border:1px solid #272d38;
  border-radius:9px;
  padding:0 10px;
  background:#151922;
  color:#fff;
  font-size:12px;
  cursor:pointer;
}

.tool-btn:active{
  transform:scale(.97);
}

.code-editor-wrap{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
  background:#0b0e13;
}

.line-numbers{
  width:43px;
  flex-shrink:0;
  overflow:hidden;
  padding-top:13px;
  border-right:1px solid #20242d;
  background:#0d1016;
  color:#596170;
  text-align:right;
  padding-right:9px;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  user-select:none;
}

.editor-container{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

.highlight{
  position:absolute;
  inset:0;
  margin:0;
  padding:13px 12px;
  overflow:auto;
  pointer-events:none;
  white-space:pre;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  color:#d8dee9;
}

.highlight code{
  font-family:inherit;
}

.code-editor{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:none;
  padding:13px 12px;
  overflow:auto;
  white-space:pre;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  background:transparent;
  color:transparent;
  caret-color:#fff;
  -webkit-text-fill-color:transparent;
  tab-size:2;
}

.code-editor::selection{
  background:rgba(80,120,180,.35);
}

.copy-range{
  flex-shrink:0;
  padding:8px;
  border-top:1px solid #20242d;
  background:#0d1016;
}

.range-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.range-label{
  color:#858c99;
  font-size:11px;
}

.range-input{
  width:55px;
  height:34px;
  border:1px solid #272d38;
  border-radius:8px;
  background:#151922;
  color:#fff;
  outline:none;
  text-align:center;
}

.copy-range-btn{
  height:34px;
  border:0;
  border-radius:8px;
  padding:0 11px;
  background:#263247;
  color:#fff;
  font-size:11px;
  cursor:pointer;
}


/* =====================================================
   7. SYNTAX COLORS
===================================================== */

.c-comment{
  color:#6a9955;
}

.c-tag{
  color:#569cd6;
}

.c-attr{
  color:#9cdcfe;
}

.c-string{
  color:#ce9178;
}

.c-keyword{
  color:#c586c0;
}

.c-number{
  color:#b5cea8;
}

.c-property{
  color:#9cdcfe;
}

.c-value{
  color:#ce9178;
}

.c-selector{
  color:#d7ba7d;
}


/* =====================================================
   8. APP PREVIEW
===================================================== */

.preview-view{
  flex-direction:column;
  align-items:center;
  overflow:auto;
  padding:14px 10px 25px;
  background:#090b10;
}

.preview-toolbar{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:14px;
}

.test-app-btn{
  height:40px;
  border:0;
  border-radius:11px;
  padding:0 18px;
  background:#27364d;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.test-app-btn:active{
  transform:scale(.97);
}

.phone{
  position:relative;
  width:min(330px,88vw);
  height:min(675px,calc(100vh - 145px));
  min-height:500px;
  padding:9px;
  border:2px solid #343943;
  border-radius:42px;
  background:#151820;
  box-shadow:
    0 0 0 3px #080a0e,
    0 18px 45px rgba(0,0,0,.55);
}

.phone-screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:33px;
  background:#fff;
}

.dynamic-island{
  position:absolute;
  z-index:10;
  top:9px;
  left:50%;
  transform:translateX(-50%);
  width:100px;
  height:28px;
  border-radius:20px;
  background:#000;
}

.preview-frame{
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}

.home-indicator{
  position:absolute;
  z-index:11;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:95px;
  height:5px;
  border-radius:10px;
  background:#fff;
  box-shadow:0 0 2px #000;
}


/* =====================================================
   9. SETTINGS
===================================================== */

.settings-panel{
  position:absolute;
  z-index:50;
  top:43px;
  right:10px;
  width:225px;
  padding:8px;
  display:none;
  border:1px solid #292f3a;
  border-radius:14px;
  background:#131720;
  box-shadow:0 15px 35px rgba(0,0,0,.45);
}

.settings-panel.show{
  display:block;
}

.setting-item{
  width:100%;
  height:42px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#fff;
  text-align:left;
  padding:0 11px;
  font-size:13px;
  cursor:pointer;
}

.setting-item:active{
  background:#202631;
}


/* =====================================================
   10. RESPONSIVE
===================================================== */

@media(max-width:360px){

  .tab{
    min-width:72px;
    font-size:12px;
  }

  .tool-btn{
    padding:0 7px;
  }

  .language-select{
    width:70px;
  }

}


/* =====================================================
   11. SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-thumb{
  background:#303642;
  border-radius:10px;
}

</style>
</head>

/* =====================================================
   1. DEFAULT CODE
===================================================== */

const defaultCode = `<!DOCTYPE html>

/* =====================================================
   2. ELEMENTS
===================================================== */

const aiTab =

/* =====================================================
   3. CODE HISTORY
===================================================== */

let history = [];

let future = [];

let historyTimer = null;

let changingHistory = false;


function addHistory(){

  if(changingHistory){
    return;
  }

  const value =
    codeEditor.value;

  if(
    history.length === 0 ||
    history[history.length - 1] !== value
  ){

    history.push(value);

    if(history.length > 100){
      history.shift();
    }

    future = [];
  }
}


function scheduleHistory(){

  clearTimeout(historyTimer);

  historyTimer =
    setTimeout(
      addHistory,
      500
    );
}


function undo(){

  if(history.length <= 1){
    return;
  }

  changingHistory = true;

  const current =
    history.pop();

  future.push(current);

  codeEditor.value =
    history[history.length - 1];

  changingHistory = false;

  updateCode();
}


function redo(){

  if(future.length === 0){
    return;
  }

  changingHistory = true;

  const value =
    future.pop();

  history.push(value);

  codeEditor.value =
    value;

  changingHistory = false;

  updateCode();
}


/* =====================================================
   4. ESCAPE HTML
===================================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


/* =====================================================
   5. HTML HIGHLIGHT
===================================================== */

function highlightHTML(code){

  let result =
    escapeHTML(code);


  result =
    result.replace(
      /(&lt;!--[\s\S]*?--&gt;)/g,
      '<span class="c-comment">$1</span>'
    );


  result =
    result.replace(
      /(&lt;\/?)([a-zA-Z][\w-]*)/g,
      '$1<span class="c-tag">$2</span>'
    );


  result =
    result.replace(
      /([\w:-]+)(=)(&quot;.*?&quot;|&#39;.*?&#39;)/g,
      '<span class="c-attr">$1</span>$2<span class="c-string">$3</span>'
    );


  return result;
}


/* =====================================================
   6. CSS HIGHLIGHT
===================================================== */

function highlightCSS(code){

  let result =
    escapeHTML(code);


  result =
    result.replace(
      /(\/\*[\s\S]*?\*\/)/g,
      '<span class="c-comment">$1</span>'
    );


  result =
    result.replace(
      /([a-zA-Z-]+)(\s*:)/g,
      '<span class="c-property">$1</span>$2'
    );


  result =
    result.replace(
      /(:\s*)([^;{}]+)/g,
      '$1<span class="c-value">$2</span>'
    );


  return result;
}


/* =====================================================
   7. JAVASCRIPT HIGHLIGHT
===================================================== */

function highlightJS(code){

  let result =
    escapeHTML(code);


  result =
    result.replace(
      /(\/\/.*$)/gm,
      '<span class="c-comment">$1</span>'
    );


  result =
    result.replace(
      /(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g,
      '<span class="c-string">$1</span>'
    );


  result =
    result.replace(
      /\b(const|let|var|function|return|if|else|for|while|new|class|this|true|false|null|undefined)\b/g,
      '<span class="c-keyword">$1</span>'
    );


  result =
    result.replace(
      /\b\d+(?:\.\d+)?\b/g,
      '<span class="c-number">$1</span>'
    );


  return result;
}


/* =====================================================
   8. JSON HIGHLIGHT
===================================================== */

function highlightJSON(code){

  let result =
    escapeHTML(code);


  result =
    result.replace(
      /(&quot;.*?&quot;)(\s*:)/g,
      '<span class="c-property">$1</span>$2'
    );


  result =
    result.replace(
      /(:\s*)(&quot;.*?&quot;)/g,
      '$1<span class="c-string">$2</span>'
    );


  result =
    result.replace(
      /\b(true|false|null)\b/g,
      '<span class="c-keyword">$1</span>'
    );


  result =
    result.replace(
      /\b\d+(?:\.\d+)?\b/g,
      '<span class="c-number">$1</span>'
    );


  return result;
}


/* =====================================================
   9. UPDATE SYNTAX
===================================================== */

function updateSyntax(){

  const code =
    codeEditor.value;

  const language =
    languageSelect.value;

  let result = "";

  if(language === "html"){
    result = highlightHTML(code);
  }
  else if(language === "css"){
    result = highlightCSS(code);
  }
  else if(language === "javascript"){
    result = highlightJS(code);
  }
  else if(language === "json"){
    result = highlightJSON(code);
  }

  if(result === ""){
    result = " ";
  }

  highlighted.innerHTML =
    result;
}


/* =====================================================
   10. LINE NUMBERS
===================================================== */

function updateLineNumbers(){

  const lines =
    codeEditor.value.split("\n").length;

  let output = "";

  for(
    let i = 1;
    i <= lines;
    i++
  ){

    output +=
      i + "<br>";
  }

  lineNumbers.innerHTML =
    output;


  endLine.max =
    lines;

  startLine.max =
    lines;

  if(
    Number(endLine.value) > lines
  ){

    endLine.value =
      lines;
  }
}


/* =====================================================
   11. CODE UPDATE
===================================================== */

function updateCode(){

  updateSyntax();

  updateLineNumbers();

  syncScroll();
}


/* =====================================================
   12. SCROLL SYNC
===================================================== */

function syncScroll(){

  highlight.scrollTop =
    codeEditor.scrollTop;

  highlight.scrollLeft =
    codeEditor.scrollLeft;

  lineNumbers.scrollTop =
    codeEditor.scrollTop;
}


/* =====================================================
   13. TAB KEY
===================================================== */

codeEditor.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Tab"){

      event.preventDefault();

      const start =
        this.selectionStart;

      const end =
        this.selectionEnd;

      const value =
        this.value;

      this.value =
        value.substring(0,start)
        + "  "
        + value.substring(end);

      this.selectionStart =
        this.selectionEnd =
        start + 2;

      updateCode();

      scheduleHistory();
    }

  }
);


/* =====================================================
   14. CODE INPUT
===================================================== */

codeEditor.addEventListener(
  "input",
  function(){

    updateCode();

    scheduleHistory();

  }
);


codeEditor.addEventListener(
  "scroll",
  syncScroll
);


/* =====================================================
   15. LANGUAGE
===================================================== */

languageSelect.addEventListener(
  "change",
  updateSyntax
);


/* =====================================================
   16. COPY ALL
===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(
      text
    );

    alert("បាន Copy កូដរួចហើយ");

  }catch(error){

    const temp =
      document.createElement("textarea");

    temp.value =
      text;

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

    alert("បាន Copy កូដរួចហើយ");
  }
}


copyAllBtn.addEventListener(
  "click",
  function(){

    copyText(
      codeEditor.value
    );

  }
);


/* =====================================================
   17. COPY RANGE
===================================================== */

copyRangeBtn.addEventListener(
  "click",
  function(){

    const lines =
      codeEditor.value.split("\n");

    let start =
      Number(startLine.value);

    let end =
      Number(endLine.value);

    if(!Number.isInteger(start)){
      start = 1;
    }

    if(!Number.isInteger(end)){
      end = lines.length;
    }

    if(
      start < 1 ||
      end < 1 ||
      start > end ||
      start > lines.length
    ){

      alert("សូមកំណត់លេខបន្ទាត់ឱ្យត្រឹមត្រូវ");

      return;
    }

    end =
      Math.min(
        end,
        lines.length
      );

    const selected =
      lines
        .slice(start - 1,end)
        .join("\n");

    copyText(selected);

  }
);


/* =====================================================
   18. RUN APP
===================================================== */

function runApp(){

  let code =
    codeEditor.value.trim();

  if(!code){
    return;
  }


  if(
    !/<html[\s>]/i.test(code)
  ){

    code =
`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
${code}
</body>
</html>`;
  }


  previewFrame.srcdoc =
    code;


  showView(
    "preview"
  );
}

/* =====================================================
   20. VIEW SWITCH
===================================================== */

function showView(view){

  aiTab.classList.remove("active");
  codeTab.classList.remove("active");
  appTab.classList.remove("active");

  chatView.classList.remove("active");
  codeView.classList.remove("active");
  previewView.classList.remove("active");


  if(view === "ai"){

    aiTab.classList.add("active");
    chatView.classList.add("active");

  }

  if(view === "code"){

    codeTab.classList.add("active");
    codeView.classList.add("active");

    updateCode();

  }

  if(view === "preview"){

    appTab.classList.add("active");
    previewView.classList.add("active");

  }

}

===================================================== */

function addMessage(
  text,
  type
){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  message.textContent =
    text;

  chatMessages.appendChild(
    message
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;
}


/* =====================================================
   28. SEND CHAT
===================================================== */

function sendMessage(){

  const text =
    chatInput.value.trim();

  if(!text){
    return;
  }


  addMessage(
    text,
    "user"
  );


  chatInput.value = "";


  setTimeout(
    function(){

      addMessage(
        "ខ្ញុំបានទទួលសំណើរបស់អ្នក។ នៅក្នុងជំហានបន្ទាប់ AI នឹងអាចយកសំណើនេះទៅកែ Code និងបង្ហាញលទ្ធផលក្នុង App Preview។",
        "ai"
      );

    },
    500
  );

}

);

      }
