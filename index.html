<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>App Write Code</title>

<style>

/* =====================================================
   1. RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
}


/* =====================================================
   2. APP SHELL
===================================================== */

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}


/* =====================================================
   3. HEADER
===================================================== */

.header{
  height:92px;
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #e5e5e7;
}

.top-row{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  gap:10px;
}

.home-btn,
.settings-btn{
  width:36px;
  height:36px;
  flex-shrink:0;
  border:0;
  border-radius:10px;
  background:#f1f1f3;
  color:#111;
  font-size:18px;
  cursor:pointer;
}

.search-wrapper{
  flex:1;
  position:relative;
  max-width:100%;
}

.search-input{
  width:100%;
  height:36px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 36px 0 12px;
  font-size:14px;
  outline:none;
  background:#fff;
  color:#111;
}

.search-input:focus{
  border-color:#111;
}

.search-clear-btn{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  border:0;
  border-radius:50%;
  background:#e5e5e7;
  color:#111;
  font-size:14px;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.search-clear-btn.show{
  display:flex;
}

.tabs{
  height:49px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
}

.tabs-middle{
  flex:1;
  min-width:12px;
}

.tab{
  height:38px;
  min-width:110px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#777;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  background:#111;
  color:#fff;
}


/* =====================================================
   4. MAIN / VIEW SWITCHING
===================================================== */

.main{
  flex:1;
  min-height:0;
  position:relative;
}

.view{
  position:absolute;
  inset:0;
  display:none;
}

.view.active{
  display:flex;
}


/* =====================================================
   5. SETTINGS PANEL
===================================================== */

.settings-panel{
  position:absolute;
  z-index:100;
  top:44px;
  right:10px;
  width:240px;
  padding:7px;
  display:none;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.settings-panel.show{
  display:block;
}

.setting-item{
  width:100%;
  min-height:43px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  text-align:left;
  padding:9px 11px;
  font-size:13px;
  cursor:pointer;
}

.setting-item:active{
  background:#f1f1f3;
}

.setting-item + .setting-item{
  margin-top:2px;
}


/* =====================================================
   6. TOAST
===================================================== */

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  min-width:190px;
  max-width:90%;
  padding:11px 16px;
  border-radius:12px;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:13px;
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =====================================================
   7. CODE EDITOR VIEW
===================================================== */

.code-view{
  flex-direction:column;
  background:#111318;
}

.code-toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  background:#181b21;
  border-bottom:1px solid #292d35;
}

.language-select,
.tool-btn{
  height:36px;
  border:1px solid #343943;
  border-radius:9px;
  background:#20242c;
  color:#fff;
  font-size:12px;
}

.language-select{
  padding:0 7px;
  max-width:82px;
  flex-shrink:0;
}

.tool-btn{
  padding:0 9px;
  cursor:pointer;
  flex-shrink:0;
}

.copy-range-btn-top{
  background:#fff;
  color:#111;
  font-weight:600;
  border:1px solid #fff;
  cursor:pointer;
}

.copy-range-btn-top:hover{
  background:#e5e5e7;
}

.range-input-top{
  width:48px;
  height:36px;
  border:1px solid #343943;
  border-radius:9px;
  outline:none;
  background:#20242c;
  color:#fff;
  text-align:center;
  font-size:12px;
  flex-shrink:0;
}

.range-label-top{
  color:#a0a5ae;
  font-size:11px;
  flex-shrink:0;
}

.code-editor-wrap{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
  background:#111318;
  -webkit-overflow-scrolling:touch;
}

.line-numbers{
  width:36px;
  flex-shrink:0;
  overflow:hidden;
  padding-top:14px;
  padding-right:6px;
  border-right:1px solid #292d35;
  background:#181b21;
  color:#656b77;
  text-align:right;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  user-select:none;
}

.editor-container{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

.highlight{
  position:absolute;
  inset:0;
  margin:0;
  padding:14px 10px;
  overflow-y:auto;
  overflow-x:hidden;
  pointer-events:none;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  color:#ddd;
}

.code-editor{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:0;
  padding:14px 10px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  background:transparent;
  color:transparent;
  caret-color:#fff;
  -webkit-text-fill-color:transparent;
  tab-size:2;
}

.code-editor::selection{
  background:rgba(100,140,200,.4);
}

.c-comment{ color:#6a9955; }
.c-tag{ color:#569cd6; }
.c-attr{ color:#9cdcfe; }
.c-string{ color:#ce9178; }
.c-keyword{ color:#c586c0; }
.c-number{ color:#b5cea8; }
.c-property{ color:#9cdcfe; }
.c-value{ color:#ce9178; }

.search-highlight{
  background:rgba(255,200,0,.4);
  border-radius:2px;
}


/* =====================================================
   8. APP PREVIEW VIEW
===================================================== */

.preview-view{
  flex-direction:column;
  align-items:center;
  overflow:auto;
  padding:12px 10px 24px;
  background:#f2f2f4;
}

.preview-toolbar{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.test-app-btn{
  height:42px;
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.phone{
  position:relative;
  width:min(330px,88vw);
  height:min(675px,calc(100vh - 140px));
  height:min(675px,calc(100dvh - 140px));
  min-height:500px;
  padding:9px;
  border:2px solid #c7c9ce;
  border-radius:43px;
  background:#fafafa;
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.phone-screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:34px;
  background:#fff;
}

.preview-frame{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}


/* =====================================================
   9. REGISTRATION MODAL
===================================================== */

.registration-overlay{
  position:fixed;
  z-index:10000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.6);
  padding:20px;
}

.registration-overlay.show{
  display:flex;
}

.registration-modal{
  width:100%;
  max-width:400px;
  background:#fff;
  border-radius:16px;
  padding:24px 20px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-height:90vh;
  overflow-y:auto;
}

.registration-title{
  font-size:20px;
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
}

.registration-subtitle{
  font-size:14px;
  color:#666;
  text-align:center;
  margin-bottom:20px;
}

.registration-step{
  display:none;
}

.registration-step.active{
  display:block;
}

.registration-input{
  width:100%;
  height:44px;
  border:1px solid #ddd;
  border-radius:10px;
  padding:0 12px;
  font-size:15px;
  outline:none;
  margin-bottom:12px;
}

.registration-input:focus{
  border-color:#111;
}

.password-wrapper{
  position:relative;
  margin-bottom:12px;
}

.password-wrapper .registration-input{
  margin-bottom:0;
  padding-right:44px;
}

.password-toggle{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#f1f1f3;
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.password-strength{
  height:4px;
  border-radius:2px;
  background:#e5e5e7;
  margin-bottom:6px;
  overflow:hidden;
}

.password-strength-bar{
  height:100%;
  width:0%;
  border-radius:2px;
  transition:.3s ease;
}

.password-strength-text{
  font-size:12px;
  color:#666;
  margin-bottom:10px;
  text-align:left;
}

.password-strength-text.weak{
  color:#d32f2f;
}

.password-strength-text.medium{
  color:#f57c00;
}

.password-strength-text.strong{
  color:#388e3c;
}

.password-requirements{
  background:#f8f8fa;
  border-radius:10px;
  padding:12px;
  margin-bottom:12px;
}

.password-requirements-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
  color:#333;
}

.password-requirement{
  font-size:12px;
  color:#666;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:6px;
}

.password-requirement.met{
  color:#388e3c;
}

.password-requirement.unmet{
  color:#d32f2f;
}

.registration-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.registration-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.error-message{
  color:#d32f2f;
  font-size:13px;
  text-align:center;
  margin-bottom:10px;
  display:none;
}

.error-message.show{
  display:block;
}

.switch-mode-link{
  display:block;
  text-align:center;
  margin-top:14px;
  color:#666;
  font-size:13px;
  cursor:pointer;
  text-decoration:underline;
}

.switch-mode-link:hover{
  color:#111;
}


/* =====================================================
   10. SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-thumb{
  background:#777;
  border-radius:10px;
}


/* =====================================================
   11. RESPONSIVE
===================================================== */

@media(max-width:360px){

  .tab{
    min-width:90px;
    font-size:12px;
  }

  .tool-btn{
    padding:0 6px;
  }

  .search-input{
    font-size:12px;
  }

  .range-input-top{
    width:38px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="top-row">

    <button class="home-btn" id="homeBtn" type="button">🖥️</button>

    <div class="search-wrapper">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="ស្វែងរកកូដ..."
        autocomplete="off"
        spellcheck="false"
      >
      <button class="search-clear-btn" id="searchClearBtn" type="button">✕</button>
    </div>

    <button class="settings-btn" id="settingsBtn" type="button">⚙️</button>

  </div>


  <div class="tabs">

    <button class="tab active" id="codeTab" type="button">&lt;/&gt; កូដ</button>

    <div class="tabs-middle" id="tabsMiddle"></div>

    <button class="tab" id="appTab" type="button">📱 App</button>

  </div>

</header>


<!-- =====================================================
     SETTINGS PANEL
===================================================== -->

<div class="settings-panel" id="settingsPanel">

  <button class="setting-item" id="settingsCopy" type="button">📎 Copy Code</button>
  <button class="setting-item" id="undoBtn" type="button">↶ Undo</button>
  <button class="setting-item" id="redoBtn" type="button">↷ Redo</button>
  <button class="setting-item" id="saveBtn" type="button">💾 Save Project</button>
  <button class="setting-item" id="deleteCodeBtn" type="button">🗑️ លុបកូដ</button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


  <!-- CODE EDITOR VIEW -->

  <section class="view code-view active" id="codeView">

    <div class="code-toolbar">

      <select class="language-select" id="languageSelect">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JS</option>
        <option value="json">JSON</option>
      </select>

      <span class="range-label-top">Copy:</span>

      <input class="range-input-top" id="startLineTop" type="number" min="1" value="1">

      <span class="range-label-top">ដល់</span>

      <input class="range-input-top" id="endLineTop" type="number" min="1" value="10">

     

<button class="tool-btn copy-range-btn-top" id="copyRangeBtnTop" type="button">📎 Copy Range</button>

    </div>


    <div class="code-editor-wrap">

      <div class="line-numbers" id="lineNumbers">1</div>

      <div class="editor-container">

        <pre class="highlight" id="highlight" aria-hidden="true"><code id="highlighted"></code></pre>

        <textarea
          class="code-editor"
          id="codeEditor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
        ></textarea>

      </div>

    </div>

  </section>


  <!-- APP PREVIEW VIEW -->

  <section class="view preview-view" id="previewView">

    <div class="preview-toolbar">
      <button class="test-app-btn" id="testAppBtn" type="button">▶ សាកល្បង App</button>
    </div>

    <div class="phone">
      <div class="phone-screen">
        <iframe class="preview-frame" id="previewFrame" title="App Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>

  </section>


</main>


<!-- =====================================================
     REGISTRATION MODAL
===================================================== -->

<div class="registration-overlay" id="registrationOverlay">

  <div class="registration-modal">

    <h2 class="registration-title" id="regTitle">ចុះឈ្មោះ</h2>
    <p class="registration-subtitle" id="regSubtitle">ប្រើ Gmail របស់អ្នកដើម្បីបន្ត</p>

    <div class="registration-step active" id="stepGmail">

      <input
        type="email"
        class="registration-input"
        id="gmailInput"
        placeholder="example@gmail.com"
        autocomplete="email"
      >

      <div class="password-wrapper">
        <input
          type="password"
          class="registration-input"
          id="passwordInput"
          placeholder="ពាក្យសម្ងាត់"
          autocomplete="new-password"
        >
        <button class="password-toggle" id="passwordToggle" type="button">👁️</button>
      </div>

      <div class="password-strength">
        <div class="password-strength-bar" id="passwordStrengthBar"></div>
      </div>

      <div class="password-strength-text" id="passwordStrengthText"></div>

      <div class="password-requirements" id="passwordRequirements">
        <div class="password-requirements-title">លក្ខខណ្ឌពាក្យសម្ងាត់៖</div>
        <div class="password-requirement" id="reqLength">✗ មានយ៉ាងហោចណាស់ 8 តួអក្សរ</div>
        <div class="password-requirement" id="reqUpper">✗ មានអក្សរធំ (A-Z)</div>
        <div class="password-requirement" id="reqLower">✗ មានអក្សរតូច (a-z)</div>
        <div class="password-requirement" id="reqNumber">✗ មានលេខ (0-9)</div>
        <div class="password-requirement" id="reqSpecial">✗ មានតួអក្សរពិសេស</div>
      </div>

      <div class="password-wrapper" id="confirmPasswordWrapper" style="display:block;">
        <input
          type="password"
          class="registration-input"
          id="confirmPasswordInput"
          placeholder="បញ្ជាក់ពាក្យសម្ងាត់ម្តងទៀត"
          autocomplete="new-password"
        >
        <button class="password-toggle" id="confirmPasswordToggle" type="button">👁️</button>
      </div>

      <div class="error-message" id="formError"></div>

      <button class="registration-btn" id="submitBtn" type="button">
        ចុះឈ្មោះ
      </button>

      <span class="switch-mode-link" id="switchModeLink">
        មានគណនីរួចហើយ? ចូលប្រើ
      </span>

    </div>

    <div class="registration-step" id="stepFaceScan">
      <p style="text-align:center; color:#666; margin-bottom:16px;">
        ស្កេនមុខនឹងត្រូវបានបន្ថែមនៅពេលក្រោយ
      </p>
      <button class="registration-btn" id="faceScanSkipBtn" type="button">
        រំលង
      </button>
    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


</div>


<script>

/* =====================================================
   1. DEFAULT CODE
===================================================== */

const defaultCode = `<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>App Write Code</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#ffffff;
  color:#111111;
  text-align:center;
  padding:40px 20px;
}

h1{
  margin-bottom:20px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#111111;
  color:white;
  cursor:pointer;
}

</style>

</head>

<body>

<h1>App Write Code</h1>

<p>Hello from App Write Code!</p>

<button onclick="alert('Hello!')">
  Test Button
</button>

</body>

</html>`;


/* =====================================================
   2. DOM ELEMENT REFERENCES
===================================================== */

function $(id){
  return document.getElementById(id);
}

const codeTab        = $("codeTab");
const appTab         = $("appTab");

const codeView       = $("codeView");
const previewView    = $("previewView");

const codeEditor     = $("codeEditor");
const highlight      = $("highlight");
const highlighted    = $("highlighted");
const lineNumbers    = $("lineNumbers");
const languageSelect = $("languageSelect");

const startLineTop   = $("startLineTop");
const endLineTop     = $("endLineTop");
const copyRangeBtnTop = $("copyRangeBtnTop");



const testAppBtn     = $("testAppBtn");
const previewFrame   = $("previewFrame");

const settingsBtn    = $("settingsBtn");
const settingsPanel  = $("settingsPanel");
const settingsCopy   = $("settingsCopy");
const undoBtn        = $("undoBtn");
const redoBtn        = $("redoBtn");
const saveBtn        = $("saveBtn");
const deleteCodeBtn  = $("deleteCodeBtn");

const homeBtn        = $("homeBtn");
const toast          = $("toast");

const searchInput    = $("searchInput");
const searchClearBtn = $("searchClearBtn");

const registrationOverlay = $("registrationOverlay");
const stepGmail      = $("stepGmail");
const stepFaceScan   = $("stepFaceScan");
const gmailInput     = $("gmailInput");
const passwordInput  = $("passwordInput");
const confirmPasswordInput = $("confirmPasswordInput");
const passwordToggle = $("passwordToggle");
const confirmPasswordToggle = $("confirmPasswordToggle");
const submitBtn      = $("submitBtn");
const switchModeLink = $("switchModeLink");

/* =====================================================
   3. TOAST NOTIFICATIONS
===================================================== */

let toastTimer = null;

function showToast(text){

  if(!toast){
    return;
  }

  toast.textContent = text;
  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer = setTimeout(function(){
    toast.classList.remove("show");
  }, 1800);

}


/* =====================================================
   4. UNDO / REDO HISTORY
===================================================== */

let history = [];
let future = [];
let historyTimer = null;
let changingHistory = false;

function addHistory(){

  if(changingHistory || !codeEditor){
    return;
  }

  const value = codeEditor.value;

  if(history.length === 0 || history[history.length - 1] !== value){

    history.push(value);

    if(history.length > 100){
      history.shift();
    }

    future = [];

  }

}

function scheduleHistory(){

  clearTimeout(historyTimer);

  historyTimer = setTimeout(addHistory, 500);

}

function undo(){

  if(history.length <= 1){
    showToast("មិនមានអ្វីសម្រាប់ Undo ទេ");
    return;
  }

  changingHistory = true;

  future.push(history.pop());

  codeEditor.value = history[history.length - 1];

  changingHistory = false;

  updateCode();

  showToast("✓ Undo បានធ្វើរួច");

}

function redo(){

  if(future.length === 0){
    showToast("មិនមានអ្វីសម្រាប់ Redo ទេ");
    return;
  }

  changingHistory = true;

  const value = future.pop();

  history.push(value);

  codeEditor.value = value;

  changingHistory = false;

  updateCode();

  showToast("✓ Redo បានធ្វើរួច");

}


/* =====================================================
   5. SYNTAX HIGHLIGHTING
===================================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}

function highlightHTML(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(&lt;!--[\s\S]*?--&gt;)/g,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /(&lt;\/?)([a-zA-Z][\w-]*)/g,
    '$1<span class="c-tag">$2</span>'
  );

  result = result.replace(
    /([\w:-]+)(=)(&quot;.*?&quot;|&#39;.*?&#39;)/g,
    '<span class="c-attr">$1</span>$2<span class="c-string">$3</span>'
  );

  return result;

}

function highlightCSS(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(\/\*[\s\S]*?\*\/)/g,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /([a-zA-Z-]+)(\s*:)/g,
    '<span class="c-property">$1</span>$2'
  );

  return result;

}

function highlightJS(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(\/\/.*$)/gm,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g,
    '<span class="c-string">$1</span>'
  );

  result = result.replace(
    /\b(const|let|var|function|return|if|else|for|while|new|class|this|true|false|null|undefined)\b/g,
    '<span class="c-keyword">$1</span>'
  );

  result = result.replace(
    /\b\d+(?:\.\d+)?\b/g,
    '<span class="c-number">$1</span>'
  );

  return result;

}

function highlightJSON(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(&quot;.*?&quot;)(\s*:)/g,
    '<span class="c-property">$1</span>$2'
  );

  result = result.replace(
    /\b(true|false|null)\b/g,
    '<span class="c-keyword">$1</span>'
  );

  result = result.replace(
    /\b\d+(?:\.\d+)?\b/g,
    '<span class="c-number">$1</span>'
  );

  return result;

}

function updateSyntax(){

  if(!codeEditor || !highlighted || !languageSelect){
    return;
  }

  const code = codeEditor.value;
  const language = languageSelect.value;

  let result = "";

  if(language === "html"){
    result = highlightHTML(code);
  }
  else if(language === "css"){
    result = highlightCSS(code);
  }
  else if(language === "javascript"){
    result = highlightJS(code);
  }
  else{
    result = highlightJSON(code);
  }

  highlighted.innerHTML = result || " ";

  applySearchHighlight();

}


/* =====================================================
   6. LINE NUMBERS
===================================================== */

function updateLineNumbers(){

  if(!codeEditor || !lineNumbers){
    return;
  }

  const total = codeEditor.value.split("\n").length;

  let output = "";

  for(let i = 1; i <= total; i++){
    output += i + "<br>";
  }

  lineNumbers.innerHTML = output;

  if(startLineTop){
    startLineTop.max = total;
  }

  if(endLineTop){

    endLineTop.max = total;

    if(Number(endLineTop.value) > total){
      endLineTop.value = total;
    }

  }

}


/* =====================================================
   7. SCROLL SYNC
===================================================== */

function syncScroll(){

  if(!codeEditor){
    return;
  }

  if(highlight){
    highlight.scrollTop = codeEditor.scrollTop;
    highlight.scrollLeft = codeEditor.scrollLeft;
  }

  if(lineNumbers){
    lineNumbers.scrollTop = codeEditor.scrollTop;
  }

}

function updateCode(){

  updateSyntax();
  updateLineNumbers();
  syncScroll();

}


/* =====================================================
   8. SEARCH FUNCTION
===================================================== */

function applySearchHighlight(){

  if(!highlighted || !searchInput){
    return;
  }

  const searchTerm = searchInput.value.trim();

  if(searchTerm.length === 0){
    return;
  }

  try{

    const regex = new RegExp("(" + searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");

    highlighted.innerHTML = highlighted.innerHTML.replace(
      /<span class="search-highlight">(.*?)<\/span>/gi,
      "$1"
    );

    highlighted.innerHTML = highlighted.innerHTML.replace(
      regex,
      '<span class="search-highlight">$1</span>'
    );

  }
  catch(error){
    /* Invalid regex - ignore */
  }

}

if(searchInput){

  searchInput.addEventListener("input", function(){

    if(searchClearBtn){
      if(this.value.length > 0){
        searchClearBtn.classList.add("show");
      }
      else{
        searchClearBtn.classList.remove("show");
      }
    }

    updateSyntax();

  });

  searchInput.addEventListener("keydown", function(event){

    if(event.key === "Escape"){

      this.value = "";

      if(searchClearBtn){
        searchClearBtn.classList.remove("show");
      }

      updateSyntax();
      this.blur();

    }

  });

}

if(searchClearBtn){

  searchClearBtn.addEventListener("click", function(){

    if(searchInput){
      searchInput.value = "";
      searchInput.focus();
    }

    this.classList.remove("show");

    updateSyntax();

  });

}


/* =====================================================
   9. EDITOR EVENTS
===================================================== */

let isComposing = false;
let renderScheduled = false;

function scheduleRender(){

  if(renderScheduled){
    return;
  }

  renderScheduled = true;

  requestAnimationFrame(function(){
    renderScheduled = false;
    updateCode();
  });

}

if(codeEditor){

  codeEditor.addEventListener("keydown", function(event){

    if(event.key === "Tab"){

      event.preventDefault();

      const start = this.selectionStart;
      const end = this.selectionEnd;

      this.value =
        this.value.substring(0, start) +
        "  " +
        this.value.substring(end);

      this.selectionStart = this.selectionEnd = start + 2;

      scheduleRender();
      scheduleHistory();

    }

  });

  codeEditor.addEventListener("compositionstart", function(){
    isComposing = true;
  });

  codeEditor.addEventListener("compositionend", function(){
    isComposing = false;
    scheduleRender();
    scheduleHistory();
  });

  codeEditor.addEventListener("input", function(){

    if(isComposing){
      return;
    }

    scheduleRender();
    scheduleHistory();

  });

  codeEditor.addEventListener("scroll", syncScroll);

}

if(languageSelect){
  languageSelect.addEventListener("change", updateSyntax);
}


/* =====================================================
   10. COPY HELPERS
===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);
    showToast("✓ បាន Copy កូដរួចហើយ");

  }
  catch(error){

    try{

      const temp = document.createElement("textarea");

      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";

      document.body.appendChild(temp);

      temp.select();
      document.execCommand("copy");

      temp.remove();

      showToast("✓ បាន Copy កូដរួចហើយ");

    }
    catch(fallbackError){

      showToast("✗ មិនអាច Copy បានទេ");

    }

  }

}

function copySelectedRange(){

  if(!codeEditor){
    return;
  }

  const lines = codeEditor.value.split("\n");

  const start = Number(startLineTop ? startLineTop.value : NaN);
  const end = Number(endLineTop ? endLineTop.value : NaN);

  if(
    !Number.isInteger(start) ||
    !Number.isInteger(end) ||
    start < 1 ||
    end < start ||
    start > lines.length
  ){

    showToast("សូមដាក់លេខបន្ទាត់ឱ្យត្រឹមត្រូវ");
    return;

  }

  const finalEnd = Math.min(end, lines.length);

  const selected = lines.slice(start - 1, finalEnd).join("\n");

  copyText(selected);

}

if(settingsCopy){

  settingsCopy.addEventListener("click", function(){
    copyText(codeEditor ? codeEditor.value : "");
    closeSettings();
  });

}

if(copyRangeBtnTop){

  copyRangeBtnTop.addEventListener("click", copySelectedRange);

}


/* =====================================================
   11. SAVE / LOAD / DELETE PROJECT
===================================================== */

function downloadCode(){

  if(!codeEditor){
    return;
  }

  try{

    const blob = new Blob([codeEditor.value], { type:"text/html" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "project.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    return true;

  }
  catch(error){

    return false;

  }

}

function saveProject(){

  if(!codeEditor){
    return;
  }

  let storedOk = false;

  try{

    localStorage.setItem("aiAppBuilderCode", codeEditor.value);
    localStorage.setItem("aiAppBuilderSavedAt", new Date().toISOString());

    storedOk = true;

  }
  catch(error){

    storedOk = false;

  }

  if(storedOk){

    showToast("✓ បានរក្សាទុក Project រួចហើយ");

  }
  else{

    const downloaded = downloadCode();

    if(downloaded){
      showToast("✓ បាន Save ជា File project.html");
    }
    else{
      showToast("✗ មិនអាចរក្សាទុកបានទេ");
    }

  }

}

function loadProject(){

  if(!codeEditor){
    return;
  }

  let saved = null;

  try{
    saved = localStorage.getItem("aiAppBuilderCode");
  }
  catch(error){
    saved = null;
  }

  if(saved !== null && saved !== ""){
    codeEditor.value = saved;
  }
  else{
    codeEditor.value = defaultCode;
  }

}

function deleteCode(){

  if(!codeEditor){
    return;
  }

  const confirmed = confirm("តើអ្នកពិតជាចង់លុបកូដទាំងអស់មែនទេ?");

  if(!confirmed){
    return;
  }

  codeEditor.value = "";

  try{
    localStorage.removeItem("aiAppBuilderCode");
    localStorage.removeItem("aiAppBuilderSavedAt");
  }
  catch(error){
    /* ignore storage errors */
  }

  history = [""];
  future = [];

  updateCode();

  if(previewFrame){
    previewFrame.srcdoc = "";
  }

  showToast("✓ បានលុបកូដរួចហើយ");

}

if(saveBtn){

  saveBtn.addEventListener("click", function(){
    saveProject();
    closeSettings();
  });

}

if(deleteCodeBtn){

  deleteCodeBtn.addEventListener("click", function(){
    deleteCode();
    closeSettings();
  });

}

/* =====================================================
   15. REGISTRATION SYSTEM
===================================================== */

let registeredEmail = "";
let registeredPasswordHash = "";
let isLoginMode = false;

function simpleHash(str){

  let hash = 0;

  if(str.length === 0){
    return hash.toString();
  }

  for(let i = 0; i < str.length; i++){

    const char = str.charCodeAt(i);

    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;

  }

  return "h_" + Math.abs(hash).toString(16);

}

function checkRegistered(){

  try{
    registeredEmail = localStorage.getItem("condwriteRegisteredEmail") || "";
    registeredPasswordHash = localStorage.getItem("condwritePasswordHash") || "";
  }
  catch(error){
    registeredEmail = "";
    registeredPasswordHash = "";
  }

  if(registeredEmail && registeredPasswordHash){
    showToast("✓ បានចូលជាមួយ " + registeredEmail);
  }
  else if(registrationOverlay){
    registrationOverlay.classList.add("show");
  }

}

function isValidGmail(email){

  if(!email){
    return false;
  }

  email = email.toLowerCase();

  return /^[a-zA-Z0-9._%+-]+@gmail\.com$/.test(email);

}

function checkPasswordRequirements(password){

  return {
    length: password.length >= 8,
    upper: /[A-Z]/.test(password),
    lower: /[a-z]/.test(password),
    number: /[0-9]/.test(password),
    special: /[\[\]{}#%\^*+=_\\|~<>$€£·.,?!']/.test(password)
  };

}

function updatePasswordStrength(password){

  const requirements = checkPasswordRequirements(password);

  let metCount = 0;

  Object.keys(requirements).forEach(function(key){
    if(requirements[key]){
      metCount++;
    }
  });

  let strength = 0;
  let text = "";
  let cssClass = "";

  if(password.length === 0){
    strength = 0;
    text = "";
    cssClass = "";
  }
  else if(metCount <= 2){
    strength = 33;
    text = "ខ្សោយ";
    cssClass = "weak";
  }
  else if(metCount === 3 || metCount === 4){
    strength = 66;
    text = "មធ្យម";
    cssClass = "medium";
  }
  else{
    strength = 100;
    text = "រឹងមាំ";
    cssClass = "strong";
  }

  if(passwordStrengthBar){
    passwordStrengthBar.style.width = strength + "%";
    passwordStrengthBar.style.background = strength <= 33 ? "#d32f2f" : strength <= 66 ? "#f57c00" : "#388e3c";
  }

  if(passwordStrengthText){
    passwordStrengthText.textContent = text;
    passwordStrengthText.className = "password-strength-text " + cssClass;
  }

  updatePasswordRequirementUI(requirements);

  return requirements;

}

function updatePasswordRequirementUI(requirements){

  const reqLength = $("reqLength");
  const reqUpper = $("reqUpper");
  const reqLower = $("reqLower");
  const reqNumber = $("reqNumber");
  const reqSpecial = $("reqSpecial");

  if(reqLength){
    reqLength.textContent = (requirements.length ? "✓" : "✗") + " មានយ៉ាងហោចណាស់ 8 តួអក្សរ";
    reqLength.className = "password-requirement " + (requirements.length ? "met" : "unmet");
  }

  if(reqUpper){
    reqUpper.textContent = (requirements.upper ? "✓" : "✗") + " មានអក្សរធំ (A-Z)";
    reqUpper.className = "password-requirement " + (requirements.upper ? "met" : "unmet");
  }

  if(reqLower){
    reqLower.textContent = (requirements.lower ? "✓" : "✗") + " មានអក្សរតូច (a-z)";
    reqLower.className = "password-requirement " + (requirements.lower ? "met" : "unmet");
  }

  if(reqNumber){
    reqNumber.textContent = (requirements.number ? "✓" : "✗") + " មានលេខ (0-9)";
    reqNumber.className = "password-requirement " + (requirements.number ? "met" : "unmet");
  }

  if(reqSpecial){
    reqSpecial.textContent = (requirements.special ? "✓" : "✗") + " មានតួអក្សរពិសេស";
    reqSpecial.className = "password-requirement " + (requirements.special ? "met" : "unmet");
  }

}

  if(!input || !button){

  if(input.type === "password"){

    button.textContent = "🙈";
  }
  else{
    input.type = "password";
    button.textContent = "👁️";
  }

}

function switchMode(){

  isLoginMode = !isLoginMode;

  if(regTitle){
    regTitle.textContent = isLoginMode ? "ចូលប្រើ" : "ចុះឈ្មោះ";
  }

  if(regSubtitle){
    regSubtitle.textContent = isLoginMode ? "បញ្ចូល Gmail និងពាក្យសម្ងាត់របស់អ្នក" : "ប្រើ Gmail របស់អ្នកដើម្បីបន្ត";
  }

  if(submitBtn){
    submitBtn.textContent = isLoginMode ? "ចូលប្រើ" : "ចុះឈ្មោះ";
  }

  if(switchModeLink){
    switchModeLink.textContent = isLoginMode ? "មិនទាន់មានគណនី? ចុះឈ្មោះ" : "មានគណនីរួចហើយ? ចូលប្រើ";
  }

  if(confirmPasswordWrapper){
    confirmPasswordWrapper.style.display = isLoginMode ? "none" : "block";
  }

  if(passwordStrengthBar){
    passwordStrengthBar.style.width = "0%";
  }

  if(passwordStrengthText){
    passwordStrengthText.textContent = "";
  }

  if(passwordInput){
    passwordInput.value = "";
  }

  if(confirmPasswordInput){
    confirmPasswordInput.value = "";
  }

  if(gmailInput){
    gmailInput.value = "";
  }

  hideError();

}

function handleSubmit(){

  hideError();

  const email = gmailInput ? gmailInput.value.trim() : "";
  const password = passwordInput ? passwordInput.value : "";
  const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value : "";

  if(!isValidGmail(email)){

    showError("សូមបញ្ចូល Gmail ឱ្យត្រឹមត្រូវ");
    return;

  }

  if(password.length === 0){

    showError("សូមបញ្ចូលពាក្យសម្ងាត់");
    return;

  }

  if(isLoginMode){

    const hash = simpleHash(password);

    if(email === registeredEmail && hash === registeredPasswordHash){

      if(registrationOverlay){
        registrationOverlay.classList.remove("show");
      }

      showToast("✓ បានចូលប្រើដោយជោគជ័យ");

    }
    else{

      showError("Gmail ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ");

    }

  }
  else{

    const requirements = checkPasswordRequirements(password);

    if(!requirements.length){
      showError("ពាក្យសម្ងាត់ត្រូវមានយ៉ាងហោចណាស់ 8 តួអក្សរ");
      return;
    }

    if(!requirements.upper){
      showError("ពាក្យសម្ងាត់ត្រូវមានអក្សរធំ (A-Z)");
      return;
    }

    if(!requirements.lower){
      showError("ពាក្យសម្ងាត់ត្រូវមានអក្សរតូច (a-z)");
      return;
    }

    if(!requirements.number){
      showError("ពាក្យសម្ងាត់ត្រូវមានលេខ (0-9)");
      return;
    }

    if(!requirements.special){
      showError("ពាក្យសម្ងាត់ត្រូវមានតួអក្សរពិសេស");
      return;
    }

    if(password !== confirmPassword){

      showError("ពាក្យសម្ងាត់មិនត្រូវគ្នា");
      return;

    }

    const hash = simpleHash(password);

    try{

      localStorage.setItem("condwriteRegisteredEmail", email);
      localStorage.setItem("condwritePasswordHash", hash);

    }
    catch(error){

      showError("មិនអាចរក្សាទុកទិន្នន័យបាន");
      return;

    }

    registeredEmail = email;
    registeredPasswordHash = hash;

    if(registrationOverlay){
      registrationOverlay.classList.remove("show");
    }

    showToast("✓ បានចុះឈ្មោះដោយជោគជ័យ");

  }

}
