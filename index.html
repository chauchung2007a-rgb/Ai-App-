<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
>

<title>App Write Code</title>

<style>

/* =====================================================
   1. RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
}


/* =====================================================
   2. APP SHELL
===================================================== */

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}


/* =====================================================
   3. HEADER
===================================================== */

.header{
  height:92px;
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #e5e5e7;
}

.top-row{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  gap:10px;
}

.home-btn,
.settings-btn{
  width:36px;
  height:36px;
  flex-shrink:0;
  border:0;
  border-radius:50px;
  background:#f1f1f3;
  color:#111;
  font-size:18px;
  cursor:pointer;
}

.logo-wrapper{
  position:relative;
  flex-shrink:0;
}

.logo-menu{
  position:absolute;
  top:40px;
  left:0;
  width:200px;
  padding:7px;
  display:none;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
  z-index:200;
}

.logo-menu.show{
  display:block;
}

.search-wrapper{
  flex:1;
  position:relative;
  max-width:100%;
}

.search-input{
  width:100%;
  height:36px;
  border:1px solid #ddd;
  border-radius:50px;
  padding:0 36px 0 16px;
  font-size:14px;
  outline:none;
  background:#fff;
  color:#111;
}

.search-input:focus{
  border-color:#111;
}

.search-clear-btn{
  position:absolute;
  right:6px;
  top:50%;
  transform:translateY(-50%);
  width:26px;
  height:26px;
  border:0;
  border-radius:50%;
  background:#e5e5e7;
  color:#111;
  font-size:14px;
  cursor:pointer;
  display:none;
  align-items:center;
  justify-content:center;
  line-height:1;
}

.search-clear-btn.show{
  display:flex;
}

.tabs{
  height:49px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
}

.tabs-middle{
  flex:1;
  min-width:12px;
}

.tab{
  height:38px;
  min-width:110px;
  border:0;
  border-radius:50px;
  background:transparent;
  color:#777;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  background:#111;
  color:#fff;
}


/* =====================================================
   4. MAIN / VIEW SWITCHING
===================================================== */

.main{
  flex:1;
  min-height:0;
  position:relative;
}

.view{
  position:absolute;
  inset:0;
  display:none;
}

.view.active{
  display:flex;
}


/* =====================================================
   5. SETTINGS PANEL
===================================================== */

.settings-panel{
  position:absolute;
  z-index:100;
  top:44px;
  right:10px;
  width:240px;
  padding:7px;
  display:none;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.settings-panel.show{
  display:block;
}

.setting-item{
  width:100%;
  min-height:43px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  text-align:left;
  padding:9px 11px;
  font-size:13px;
  cursor:pointer;
}

.setting-item:active{
  background:#f1f1f3;
}

.setting-item + .setting-item{
  margin-top:2px;
}

.settings-divider{
  border-top:1px solid #ddd;
  margin:6px 0;
}


/* =====================================================
   6. TOAST
===================================================== */

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  min-width:190px;
  max-width:90%;
  padding:11px 16px;
  border-radius:50px;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:13px;
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =====================================================
   7. CODE EDITOR VIEW
===================================================== */

.code-view{
  flex-direction:column;
  background:#111318;
}

.code-toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  background:#181b21;
  border-bottom:1px solid #292d35;
  overflow-x:auto;
}

.language-select,
.tool-btn{
  height:36px;
  border:1px solid #343943;
  border-radius:50px;
  background:#20242c;
  color:#fff;
  font-size:12px;
}

.language-select{
  padding:0 7px;
  max-width:82px;
  flex-shrink:0;
}

.tool-btn{
  padding:0 9px;
  cursor:pointer;
  flex-shrink:0;
}

.copy-range-btn-top{
  background:#fff;
  color:#111;
  font-weight:600;
  border:1px solid #fff;
  cursor:pointer;
}

.copy-range-btn-top:hover{
  background:#e5e5e7;
}

.range-input-top{
  width:48px;
  height:36px;
  border:1px solid #343943;
  border-radius:50px;
  outline:none;
  background:#20242c;
  color:#fff;
  text-align:center;
  font-size:12px;
  flex-shrink:0;
}

.range-label-top{
  color:#a0a5ae;
  font-size:11px;
  flex-shrink:0;
}

.code-editor-wrap{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
  background:#111318;
  -webkit-overflow-scrolling:touch;
}

.line-numbers{
  width:36px;
  flex-shrink:0;
  overflow:hidden;
  padding-top:14px;
  padding-right:6px;
  border-right:1px solid #292d35;
  background:#181b21;
  color:#656b77;
  text-align:right;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  user-select:none;
}

.editor-container{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

.highlight{
  position:absolute;
  inset:0;
  margin:0;
  padding:14px 10px;
  overflow-y:auto;
  overflow-x:hidden;
  pointer-events:none;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  color:#ddd;
}

.code-editor{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:0;
  padding:14px 10px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  white-space:pre-wrap;
  word-break:break-word;
  overflow-wrap:anywhere;
  font-family:monospace;
  font-size:14px;
  line-height:1.7;
  background:transparent;
  color:transparent;
  caret-color:#fff;
  -webkit-text-fill-color:transparent;
  tab-size:2;
}

.code-editor::selection{
  background:rgba(100,140,200,.4);
}

.c-comment{ color:#6a9955; }
.c-tag{ color:#569cd6; }
.c-attr{ color:#9cdcfe; }
.c-string{ color:#ce9178; }
.c-keyword{ color:#c586c0; }
.c-number{ color:#b5cea8; }
.c-property{ color:#9cdcfe; }
.c-value{ color:#ce9178; }

.search-highlight{
  background:rgba(255,200,0,.4);
  border-radius:2px;
}

.search-highlight-current{
  background:rgba(255,150,0,.6);
  border-radius:2px;
  outline:1px solid #ff9800;
}


/* =====================================================
   8. APP PREVIEW VIEW
===================================================== */

.preview-view{
  flex-direction:column;
  align-items:center;
  overflow:auto;
  padding:12px 10px 24px;
  background:#f2f2f4;
}

.preview-toolbar{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.test-app-btn{
  height:42px;
  border:0;
  border-radius:50px;
  padding:0 20px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.phone{
  position:relative;
  width:min(330px,88vw);
  height:min(675px,calc(100vh - 140px));
  height:min(675px,calc(100dvh - 140px));
  min-height:500px;
  padding:9px;
  border:2px solid #c7c9ce;
  border-radius:43px;
  background:#fafafa;
  box-shadow:0 15px 40px rgba(0,0,0,.22);
}

.phone-screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:34px;
  background:#fff;
}

.preview-frame{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}


/* =====================================================
   9. REGISTRATION MODAL
===================================================== */

.registration-overlay{
  position:fixed;
  z-index:10000;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.7);
  padding:20px;
  backdrop-filter:blur(5px);
}

.registration-overlay.show{
  display:flex;
}

.registration-modal{
  width:100%;
  max-width:380px;
  background:#fff;
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 25px 70px rgba(0,0,0,.4);
  max-height:90vh;
  overflow-y:auto;
}

.registration-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  width:70px;
  height:70px;
  margin:0 auto 16px;
  border-radius:50%;
  background:#111;
  color:#fff;
  font-size:36px;
  box-shadow:0 8px 20px rgba(0,0,0,.3);
}

.registration-title{
  font-size:22px;
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
  color:#111;
}

.registration-subtitle{
  font-size:14px;
  color:#666;
  text-align:center;
  margin-bottom:24px;
}

.registration-step{
  display:none;
}

.registration-step.active{
  display:block;
}

.input-with-icon{
  position:relative;
  margin-bottom:14px;
}

.input-with-icon .registration-input{
  width:100%;
  height:48px;
  border:2px solid #e5e5e7;
  border-radius:50px;
  padding:0 16px 0 52px;
  font-size:15px;
  outline:none;
  background:#fafafa;
  color:#111;
  transition:border-color .2s ease, background .2s ease;
}

.input-with-icon .registration-input:focus{
  border-color:#111;
  background:#fff;
}

.input-icon{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  pointer-events:none;
  box-shadow:0 3px 8px rgba(0,0,0,.2);
  z-index:1;
}

.registration-input{
  width:100%;
  height:48px;
  border:2px solid #e5e5e7;
  border-radius:50px;
  padding:0 16px;
  font-size:15px;
  outline:none;
  background:#fafafa;
  color:#111;
  transition:border-color .2s ease, background .2s ease;
}

.registration-input:focus{
  border-color:#111;
  background:#fff;
}

.password-wrapper{
  position:relative;
  margin-bottom:14px;
}

.password-wrapper .registration-input{
  margin-bottom:0;
  padding-right:50px;
  padding-left:52px;
}

.password-toggle{
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#f1f1f3;
  cursor:pointer;
  font-size:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:2;
}

.password-strength{
  height:4px;
  border-radius:2px;
  background:#e5e5e7;
  margin-bottom:6px;
  overflow:hidden;
}

.password-strength-bar{
  height:100%;
  width:0%;
  border-radius:2px;
  transition:.3s ease;
}

.password-strength-text{
  font-size:12px;
  color:#666;
  margin-bottom:10px;
  text-align:left;
}

.password-strength-text.weak{
  color:#d32f2f;
}

.password-strength-text.medium{
  color:#f57c00;
}

.password-strength-text.strong{
  color:#388e3c;
}

.password-requirements{
  background:#f8f8fa;
  border-radius:50px;
  margin-bottom:14px;
  overflow:hidden;
  transition:border-radius .2s ease;
}

.password-requirements.open{
  border-radius:16px;
}

.password-requirements-toggle{
  width:100%;
  height:44px;
  border:0;
  border-radius:50px;
  background:#f8f8fa;
  padding:0 16px;
  font-size:13px;
  font-weight:600;
  color:#333;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
  transition:background .2s ease;
}

.password-requirements-toggle:active{
  background:#e5e5e7;
}

.password-requirements-toggle-icon{
  font-size:12px;
  transition:transform .2s ease;
}

.password-requirements-toggle-icon.open{
  transform:rotate(180deg);
}

.password-requirements-content{
  display:none;
  padding:14px;
}

.password-requirements-content.show{
  display:block;
}

.password-requirements-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:6px;
  color:#333;
}

.password-requirement{
  font-size:12px;
  color:#666;
  margin-bottom:3px;
  display:flex;
  align-items:center;
  gap:6px;
}

.password-requirement.met{
  color:#388e3c;
}

.password-requirement.unmet{
  color:#d32f2f;
}

.registration-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:50px;
  background:#111;
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  transition:background .2s ease, transform .1s ease;
}

.registration-btn:active{
  transform:scale(.97);
}

.registration-btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.error-message{
  color:#d32f2f;
  font-size:13px;
  text-align:center;
  margin-bottom:10px;
  display:none;
}

.error-message.show{
  display:block;
}

.switch-mode-link{
  display:block;
  text-align:center;
  margin-top:14px;
  color:#666;
  font-size:13px;
  cursor:pointer;
  text-decoration:underline;
}

.switch-mode-link:hover{
  color:#111;
}


/* =====================================================
   10. SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-thumb{
  background:#777;
  border-radius:10px;
}


/* =====================================================
   11. RESPONSIVE
===================================================== */

@media(max-width:360px){

  .tab{
    min-width:90px;
    font-size:12px;
  }

  .tool-btn{
    padding:0 6px;
  }

  .search-input{
    font-size:12px;
  }

  .range-input-top{
    width:38px;
  }

  .registration-modal{
    padding:24px 18px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="top-row">

    <div class="logo-wrapper">
      <button class="home-btn" id="homeBtn" type="button">🖥️</button>
    </div>

    <div class="search-wrapper">
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search code..."
        autocomplete="off"
        spellcheck="false"
      >
      <button class="search-clear-btn" id="searchClearBtn" type="button">✕</button>
    </div>

    <button class="settings-btn" id="settingsBtn" type="button">⚙️</button>

  </div>


  <div class="tabs">

    <button class="tab active" id="codeTab" type="button">&lt;/&gt; Code</button>

    <div class="tabs-middle" id="tabsMiddle"></div>

    <button class="tab" id="appTab" type="button">📱 App</button>

  </div>

</header>


<!-- =====================================================
     LOGO MENU
===================================================== -->

<div class="logo-menu" id="logoMenu">

  <button class="setting-item" id="changeNameBtn" type="button">✏️ Change Name</button>
  <button class="setting-item" id="changePasswordBtn" type="button">🔑 Change Password</button>

  <div class="settings-divider"></div>

  <button class="setting-item" id="logoutBtnLogo" type="button">🚪 Logout</button>

</div>


<!-- =====================================================
     SETTINGS PANEL
===================================================== -->

<div class="settings-panel" id="settingsPanel">

  <button class="setting-item" id="settingsCopy" type="button">📎 Copy Code</button>
  <button class="setting-item" id="undoBtn" type="button">↶ Undo</button>
  <button class="setting-item" id="redoBtn" type="button">↷ Redo</button>
  <button class="setting-item" id="saveBtn" type="button">💾 Save Project</button>
  <button class="setting-item" id="deleteCodeBtn" type="button">🗑️ Delete Code</button>

  <div class="settings-divider"></div>

  <button class="setting-item" id="switchAccountBtn" type="button">🔄 Switch Account</button>
  <button class="setting-item" id="logoutBtn" type="button">🚪 Logout</button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


  <!-- CODE EDITOR VIEW -->

  <section class="view code-view active" id="codeView">

    <div class="code-toolbar">

      <select class="language-select" id="languageSelect">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JS</option>
        <option value="json">JSON</option>
      </select>

      <span class="range-label-top">Copy:</span>

      <input class="range-input-top" id="startLineTop" type="number" min="1" value="1">

      <span class="range-label-top">to</span>

      <input class="range-input-top" id="endLineTop" type="number" min="1" value="10">

      <button class="tool-btn copy-range-btn-top" id="copyRangeBtnTop" type="button">📎 Copy Range</button>

    </div>


    <div class="code-editor-wrap">

      <div class="line-numbers" id="lineNumbers">1</div>

      <div class="editor-container">

        <pre class="highlight" id="highlight" aria-hidden="true"><code id="highlighted"></code></pre>

        <textarea
          class="code-editor"
          id="codeEditor"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          autocorrect="off"
        ></textarea>

      </div>

    </div>

  </section>


  <!-- APP PREVIEW VIEW -->

  <section class="view preview-view" id="previewView">

    <div class="preview-toolbar">
      <button class="test-app-btn" id="testAppBtn" type="button">▶ Test App</button>
    </div>

    <div class="phone">
      <div class="phone-screen">
        <iframe class="preview-frame" id="previewFrame" title="App Preview" sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin allow-popups-to-escape-sandbox"></iframe>
      </div>
    </div>

  </section>


</main>


<!-- =====================================================
     REGISTRATION MODAL
===================================================== -->

<div class="registration-overlay" id="registrationOverlay">

  <div class="registration-modal">

    <div class="registration-logo">🖥️</div>

    <h2 class="registration-title" id="regTitle">Sign Up</h2>
    <p class="registration-subtitle" id="regSubtitle">Enter your name and password</p>

    <!-- Registration / Login Form -->
    <div class="registration-step active" id="stepGmail">

      <div class="input-with-icon">
        <input
          type="text"
          class="registration-input"
          id="nameInput"
          placeholder="Your name"
          autocomplete="name"
        >
        <span class="input-icon">👤</span>
      </div>

      <div class="input-with-icon password-wrapper">
        <input
          type="password"
          class="registration-input"
          id="passwordInput"
          placeholder="Password"
          autocomplete="new-password"
        >
        <span class="input-icon">🔑</span>
        <button class="password-toggle" id="passwordToggle" type="button">👁️</button>
      </div>

      <div class="password-strength">
        <div class="password-strength-bar" id="passwordStrengthBar"></div>
      </div>

      <div class="password-strength-text" id="passwordStrengthText"></div>

      <div class="password-requirements" id="passwordRequirements">
        <button class="password-requirements-toggle" id="passwordRequirementsToggle" type="button">
          <span>Password requirements</span>
          <span class="password-requirements-toggle-icon" id="passwordRequirementsIcon">▼</span>
        </button>
        <div class="password-requirements-content" id="passwordRequirementsContent">
          <div class="password-requirements-title">Password requirements:</div>
          <div class="password-requirement" id="reqLength">✗ At least 8 characters</div>
          <div class="password-requirement" id="reqUpper">✗ Uppercase letter (A-Z)</div>
          <div class="password-requirement" id="reqLower">✗ Lowercase letter (a-z)</div>
          <div class="password-requirement" id="reqNumber">✗ Number (0-9)</div>
          <div class="password-requirement" id="reqSpecial">✗ Special character ( -/:;()៛&@". ,?!' )</div>
        </div>
      </div>

/* =====================================================
   4. UNDO / REDO HISTORY
===================================================== */

let history = [];
let future = [];
let historyTimer = null;
let changingHistory = false;

function addHistory(){

  if(changingHistory || !codeEditor){
    return;
  }

  const value = codeEditor.value;

  if(history.length === 0 || history[history.length - 1] !== value){

    history.push(value);

    if(history.length > 100){
      history.shift();
    }

    future = [];

  }

}

function scheduleHistory(){

  clearTimeout(historyTimer);

  historyTimer = setTimeout(addHistory, 500);

}

function undo(){

  if(history.length <= 1){
    showToast("Nothing to undo");
    return;
  }

  changingHistory = true;

  future.push(history.pop());

  codeEditor.value = history[history.length - 1];

  changingHistory = false;

  updateCode();

  showToast("✓ Undo successful");

}

function redo(){

  if(future.length === 0){
    showToast("Nothing to redo");
    return;
  }

  changingHistory = true;

  const value = future.pop();

  history.push(value);

  codeEditor.value = value;

  changingHistory = false;

  updateCode();

  showToast("✓ Redo successful");

}


/* =====================================================
   5. SYNTAX HIGHLIGHTING
===================================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}

function highlightHTML(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(&lt;!--[\s\S]*?--&gt;)/g,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /(&lt;\/?)([a-zA-Z][\w-]*)/g,
    '$1<span class="c-tag">$2</span>'
  );

  result = result.replace(
    /([\w:-]+)(=)(&quot;.*?&quot;|&#39;.*?&#39;)/g,
    '<span class="c-attr">$1</span>$2<span class="c-string">$3</span>'
  );

  return result;

}

function highlightCSS(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(\/\*[\s\S]*?\*\/)/g,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /([a-zA-Z-]+)(\s*:)/g,
    '<span class="c-property">$1</span>$2'
  );

  return result;

}

function highlightJS(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(\/\/.*$)/gm,
    '<span class="c-comment">$1</span>'
  );

  result = result.replace(
    /(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g,
    '<span class="c-string">$1</span>'
  );

  result = result.replace(
    /\b(const|let|var|function|return|if|else|for|while|new|class|this|true|false|null|undefined)\b/g,
    '<span class="c-keyword">$1</span>'
  );

  result = result.replace(
    /\b\d+(?:\.\d+)?\b/g,
    '<span class="c-number">$1</span>'
  );

  return result;

}

function highlightJSON(code){

  let result = escapeHTML(code);

  result = result.replace(
    /(&quot;.*?&quot;)(\s*:)/g,
    '<span class="c-property">$1</span>$2'
  );

  result = result.replace(
    /\b(true|false|null)\b/g,
    '<span class="c-keyword">$1</span>'
  );

  result = result.replace(
    /\b\d+(?:\.\d+)?\b/g,
    '<span class="c-number">$1</span>'
  );

  return result;

}

function updateSyntax(){

  if(!codeEditor || !highlighted || !languageSelect){
    return;
  }

  const code = codeEditor.value;
  const language = languageSelect.value;

  let result = "";

  if(language === "html"){
    result = highlightHTML(code);
  }
  else if(language === "css"){
    result = highlightCSS(code);
  }
  else if(language === "javascript"){
    result = highlightJS(code);
  }
  else{
    result = highlightJSON(code);
  }

  highlighted.innerHTML = result || " ";

}


/* =====================================================
   6. LINE NUMBERS
===================================================== */

function updateLineNumbers(){

  if(!codeEditor || !lineNumbers){
    return;
  }

  const total = codeEditor.value.split("\n").length;

  let output = "";

  for(let i = 1; i <= total; i++){
    output += i + "<br>";
  }

  lineNumbers.innerHTML = output;

  if(startLineTop){
    startLineTop.max = total;
  }

  if(endLineTop){

    endLineTop.max = total;

    if(Number(endLineTop.value) > total){
      endLineTop.value = total;
    }

  }

}

function syncScroll(){

/* =====================================================
   8. SEARCH FUNCTION
===================================================== */

let searchResults = [];
let currentSearchIndex = -1;

function performSearch(){

  if(!codeEditor || !searchInput){
    return;
  }

  const searchTerm = searchInput.value.trim().toLowerCase();

  if(searchTerm.length === 0){

    searchResults = [];
    currentSearchIndex = -1;

    if(searchClearBtn){
      searchClearBtn.classList.remove("show");
    }

    updateSyntax();
    return;

  }

  if(searchClearBtn){
    searchClearBtn.classList.add("show");
  }

  const code = codeEditor.value;
  const lines = code.split("\n");

  searchResults = [];

  for(let i = 0; i < lines.length; i++){

    const lineText = lines[i].toLowerCase();
    let index = lineText.indexOf(searchTerm);

    while(index !== -1){

      searchResults.push({
        line: i,
        column: index,
        length: searchTerm.length
      });

      index = lineText.indexOf(searchTerm, index + searchTerm.length);

    }

  }

  currentSearchIndex = -1;

  if(searchResults.length > 0){

    showToast("Found " + searchResults.length + " places");

    currentSearchIndex = 0;

    scrollToSearchResult(currentSearchIndex);

    highlightSearchResults();

  }
  else{

    showToast("Not found: \"" + searchTerm + "\"");

    updateSyntax();

  }

}

function scrollToSearchResult(index){

  if(!codeEditor || index < 0 || index >= searchResults.length){
    return;
  }

  const result = searchResults[index];

  const lines = codeEditor.value.split("\n");

  let charCount = 0;

  for(let i = 0; i < result.line; i++){
    charCount += lines[i].length + 1;
  }

  charCount += result.column;

  codeEditor.focus();
  codeEditor.setSelectionRange(charCount, charCount + result.length);

  const lineHeight = 1.7 * 14;
  const scrollTop = result.line * lineHeight - (codeEditor.clientHeight / 2);

  codeEditor.scrollTop = Math.max(0, scrollTop);

  syncScroll();

}

function highlightSearchResults(){

  if(!highlighted || !codeEditor){
    return;
  }

  updateSyntax();

  const searchTerm = searchInput.value.trim();

  if(searchTerm.length === 0 || searchResults.length === 0){
    return;
  }

  try{

    const escapedTerm = searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const regex = new RegExp("(" + escapedTerm + ")", "gi");

    highlighted.innerHTML = highlighted.innerHTML.replace(
      /<span class="search-highlight-current">(.*?)<\/span>/gi,
      "$1"
    );

    highlighted.innerHTML = highlighted.innerHTML.replace(
      /<span class="search-highlight">(.*?)<\/span>/gi,
      "$1"
    );

    highlighted.innerHTML = highlighted.innerHTML.replace(
      regex,
      '<span class="search-highlight">$1</span>'
    );

    if(currentSearchIndex >= 0 && currentSearchIndex < searchResults.length){

      const currentResult = searchResults[currentSearchIndex];

      const lines = highlighted.innerHTML.split("\n");

      if(lines[currentResult.line]){

        const lineHTML = lines[currentResult.line];

        const beforeText = lineHTML.substring(0, currentResult.column);
        const matchText = lineHTML.substring(currentResult.column, currentResult.column + currentResult.length);
        const afterText = lineHTML.substring(currentResult.column + currentResult.length);

        lines[currentResult.line] = beforeText + '<span class="search-highlight-current">' + matchText + '</span>' + afterText;

        highlighted.innerHTML = lines.join("\n");

      }

    }

  }
  catch(error){
    /* Invalid regex - ignore */
  }

}

if(searchInput){

  searchInput.addEventListener("input", function(){
    performSearch();
  });

  searchInput.addEventListener("keydown", function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      if(searchResults.length === 0){
        performSearch();
        return;
      }

      if(currentSearchIndex < searchResults.length - 1){
        currentSearchIndex++;
      }
      else{
        currentSearchIndex = 0;
      }

      scrollToSearchResult(currentSearchIndex);
      highlightSearchResults();

    }

    if(event.key === "Escape"){

      this.value = "";

      searchResults = [];
      currentSearchIndex = -1;

      if(searchClearBtn){
        searchClearBtn.classList.remove("show");
      }

      updateSyntax();
      this.blur();

    }

  });

}

        "  " +

      scheduleRender();

    }

  });

  codeEditor.addEventListener("compositionstart", function(){
    isComposing = true;
  });

  codeEditor.addEventListener("compositionend", function(){
    isComposing = false;
    scheduleRender();

    scheduleRender();

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);
    showToast("✓ Code copied successfully");

  }
  catch(error){

    try{

      const temp = document.createElement("textarea");

      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";

      document.body.appendChild(temp);

      temp.select();
      document.execCommand("copy");

      temp.remove();

      showToast("✓ Code copied successfully");

    }
    catch(fallbackError){

      showToast("✗ Cannot copy");

    }

  }

}

function copySelectedRange(){

  if(!codeEditor){
    return;
  }

  const lines = codeEditor.value.split("\n");

  const start = Number(startLineTop ? startLineTop.value : NaN);
  const end = Number(endLineTop ? endLineTop.value : NaN);

  if(
    !Number.isInteger(start) ||
    !Number.isInteger(end) ||
    start < 1 ||
    end < start ||
    start > lines.length
  ){

    showToast("Please enter valid line numbers");
    return;

  }

  const finalEnd = Math.min(end, lines.length);

  const selected = lines.slice(start - 1, finalEnd).join("\n");

  copyText(selected);

}

/* =====================================================

===================================================== */

function downloadCode(){

  if(!codeEditor){
    return;
  }

  try{

    const blob = new Blob([codeEditor.value], { type:"text/html" });
    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = "project.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    return true;

  }
  catch(error){

    return false;

  }

}

function saveProject(){

  if(!codeEditor){
    return;
  }

  let storedOk = false;

  try{

    localStorage.setItem("aiAppBuilderCode", codeEditor.value);
    localStorage.setItem("aiAppBuilderSavedAt", new Date().toISOString());

    loadAccounts();

    const currentUser = localStorage.getItem("condwriteCurrentUser") || "";

    if(currentUser && allAccounts[currentUser]){
      allAccounts[currentUser].code = codeEditor.value;
      saveAccounts();
    }

    storedOk = true;

  }
  catch(error){

    storedOk = false;

  }

  if(storedOk){

    showToast("✓ Project saved successfully");

  }
  else{

    const downloaded = downloadCode();

    if(downloaded){
      showToast("✓ Saved as project.html");
    }
    else{
      showToast("✗ Cannot save");
    }

  }

}

function loadProject(){

  if(!codeEditor){
    return;
  }

  loadAccounts();

  let currentUser = "";

  try{
    currentUser = localStorage.getItem("condwriteCurrentUser") || "";
  }
  catch(error){
    currentUser = "";
  }

  let saved = null;

  if(currentUser && allAccounts[currentUser] && allAccounts[currentUser].code){

    saved = allAccounts[currentUser].code;

  }
  else{

    try{
      saved = localStorage.getItem("aiAppBuilderCode");
    }
    catch(error){
      saved = null;
    }

  }

  if(saved !== null && saved !== ""){
    codeEditor.value = saved;
  }
  else{
    codeEditor.value = defaultCode;
  }

}

function deleteCode(){

  if(!codeEditor){
    return;
  }

  const confirmed = confirm("Are you sure you want to delete all code?");

  if(!confirmed){
    return;
  }

  codeEditor.value = "";

  try{
    localStorage.removeItem("aiAppBuilderCode");
    localStorage.removeItem("aiAppBuilderSavedAt");

    loadAccounts();

    const currentUser = localStorage.getItem("condwriteCurrentUser") || "";

    if(currentUser && allAccounts[currentUser]){
      allAccounts[currentUser].code = "";
      saveAccounts();
    }

  }
  catch(error){
    /* ignore storage errors */
  }

  history = [""];
  future = [];

  updateCode();

  if(previewFrame){
    previewFrame.srcdoc = "";
  }

  showToast("✓ Code deleted successfully");

}

if(saveBtn){

  saveBtn.addEventListener("click", function(){
    saveProject();
    closeSettings();

    }

    }

}

function saveAccounts(){

  try{
    localStorage.setItem("condwriteAllAccounts", JSON.stringify(allAccounts));
  }
  catch(error){
    /* ignore storage errors */
  }

}

function simpleHash(str){

  let hash = 0;

  if(str.length === 0){
    return hash.toString();
  }

  for(let i = 0; i < str.length; i++){

    const char = str.charCodeAt(i);

    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;

  }

  return "h_" + Math.abs(hash).toString(16);

}

function checkRegistered(){

  loadAccounts();

  let currentUser = "";

  try{
    currentUser = localStorage.getItem("condwriteCurrentUser") || "";
  }
  catch(error){
    /* ignore */
  }

  if(currentUser && allAccounts[currentUser]){

    registeredName = allAccounts[currentUser].name || "";
    registeredPasswordHash = allAccounts[currentUser].passwordHash || "";

    showToast("✓ Signed in as " + registeredName);

  }
  else{

    registeredName = "";
    registeredPasswordHash = "";

    if(registrationOverlay){
      registrationOverlay.classList.add("show");
    }

  }

}

function isValidName(name){

  if(!name){
    return false;
  }

  name = name.trim();

  return name.length >= 2;

}

function checkPasswordRequirements(password){

  return {
    length: password.length >= 8,
    upper: /[A-Z]/.test(password),
    lower: /[a-z]/.test(password),
    number: /[0-9]/.test(password),
    special: /[\[\]{}#%\^*+=_\\|~<>$€£·.,?!'\-/:;()៛&@"]/.test(password)
  };

}

function updatePasswordStrength(password){

  const requirements = checkPasswordRequirements(password);

  if(password.length > 0){

    if(passwordRequirementsContent && !passwordRequirementsContent.classList.contains("show")){

      passwordRequirementsContent.classList.add("show");
      passwordRequirementsIcon.classList.add("open");
      passwordRequirements.classList.add("open");
      passwordRequirementsToggle.style.borderRadius = "16px 16px 0 0";

    }

  }

  let metCount = 0;

  Object.keys(requirements).forEach(function(key){
    if(requirements[key]){
      metCount++;
    }
  });

  let strength = 0;
  let text = "";
  let cssClass = "";

  if(password.length === 0){
    strength = 0;
    text = "";
    cssClass = "";
  }
  else if(metCount <= 2){
    strength = 33;
    text = "Weak";
    cssClass = "weak";
  }
  else if(metCount === 3 || metCount === 4){
    strength = 66;
    text = "Medium";
    cssClass = "medium";
  }
  else{
    strength = 100;
    text = "Strong";
    cssClass = "strong";
  }

  if(passwordStrengthBar){
    passwordStrengthBar.style.width = strength + "%";
    passwordStrengthBar.style.background = strength <= 33 ? "#d32f2f" : strength <= 66 ? "#f57c00" : "#388e3c";
  }

  if(passwordStrengthText){
    passwordStrengthText.textContent = text;
    passwordStrengthText.className = "password-strength-text " + cssClass;
  }

  updatePasswordRequirementUI(requirements);

  return requirements;

}

function updatePasswordRequirementUI(requirements){

  const reqLength = $("reqLength");
  const reqUpper = $("reqUpper");
  const reqLower = $("reqLower");
  const reqNumber = $("reqNumber");
  const reqSpecial = $("reqSpecial");

  if(reqLength){
    reqLength.textContent = (requirements.length ? "✓" : "✗") + " At least 8 characters";
    reqLength.className = "password-requirement " + (requirements.length ? "met" : "unmet");
  }

  if(reqUpper){
    reqUpper.textContent = (requirements.upper ? "✓" : "✗") + " Uppercase letter (A-Z)";
    reqUpper.className = "password-requirement " + (requirements.upper ? "met" : "unmet");
  }

  if(reqLower){
    reqLower.textContent = (requirements.lower ? "✓" : "✗") + " Lowercase letter (a-z)";
    reqLower.className = "password-requirement " + (requirements.lower ? "met" : "unmet");
  }

  if(reqNumber){
    reqNumber.textContent = (requirements.number ? "✓" : "✗") + " Number (0-9)";
    reqNumber.className = "password-requirement " + (requirements.number ? "met" : "unmet");
  }

  if(reqSpecial){
    reqSpecial.textContent = (requirements.special ? "✓" : "✗") + " Special character ( -/:;()៛&@\".,?!' )";
    reqSpecial.className = "password-requirement " + (requirements.special ? "met" : "unmet");
  }

}

function showError(message){

    formError.classList.add("show");

}

function hideError(){

}

function togglePasswordVisibility(inputId, buttonId){

  const input = $(inputId);
  const button = $(buttonId);

  if(!input || !button){
    return;
  }

  if(input.type === "password"){
    input.type = "text";
    button.textContent = "🙈";
  }
  else{
    input.type = "password";
    button.textContent = "👁️";
  }

}

function showStep(step){

  }

function handleSubmit(){

  hideError();

  const name = nameInput ? nameInput.value.trim() : "";
  const password = passwordInput ? passwordInput.value : "";
  const confirmPassword = confirmPasswordInput ? confirmPasswordInput.value : "";

  if(!isValidName(name)){

    showError("Please enter your name (at least 2 characters)");
    return;

  }

  if(password.length === 0){

    showError("Please enter password");
    return;

  }

  if(isLoginMode){

    const hash = simpleHash(password);

    loadAccounts();

    let accountFound = false;

    for(const accountKey in allAccounts){

      if(allAccounts[accountKey].name === name && allAccounts[accountKey].passwordHash === hash){

        accountFound = true;
        break;

      }

    }

    if(!accountFound){

      showError("Invalid name or password");
      return;

    }

    const accountKey = name + "_" + hash;

    registeredName = name;
    registeredPasswordHash = hash;

    try{
      localStorage.setItem("condwriteCurrentUser", accountKey);
    }
    catch(error){
      /* ignore */
    }

    if(allAccounts[accountKey] && allAccounts[accountKey].code){
      codeEditor.value = allAccounts[accountKey].code;
    }
    else{
      codeEditor.value = defaultCode;
    }

    history = [codeEditor.value];
    future = [];

    updateCode();

    if(registrationOverlay){
      registrationOverlay.classList.remove("show");
    }

    showToast("✓ Signed in as " + name + " successfully");

  }
  else{

    const requirements = checkPasswordRequirements(password);

    if(!requirements.length){
      showError("Password must be at least 8 characters");
      return;
    }

    if(!requirements.upper){
      showError("Password must contain uppercase letter (A-Z)");
      return;
    }

    if(!requirements.lower){
      showError("Password must contain lowercase letter (a-z)");
      return;
    }

    if(!requirements.number){
      showError("Password must contain number (0-9)");
      return;
    }

    if(!requirements.special){
      showError("Password must contain special character ( -/:;()៛&@\".,?!' )");
      return;
    }

    if(password !== confirmPassword){

      showError("Passwords do not match");
      return;

    }

    const hash = simpleHash(password);

    loadAccounts();

    const accountKey = name + "_" + hash;

    if(allAccounts[accountKey]){

      showError("This account already exists");
      return;

    }

    allAccounts[accountKey] = {
      name: name,
      passwordHash: hash,
      code: defaultCode,
      createdAt: new Date().toISOString()
    };

    saveAccounts();

    try{
      localStorage.setItem("condwriteCurrentUser", accountKey);
    }
    catch(error){
      /* ignore */
    }

    registeredName = name;
    registeredPasswordHash = hash;

    codeEditor.value = defaultCode;

    history = [codeEditor.value];
    future = [];

    updateCode();

    if(registrationOverlay){
      registrationOverlay.classList.remove("show");
    }

    showToast("✓ Registered successfully");

  }

}

function clearAccount(){

  loadAccounts();

  let currentUser = "";

  try{
    currentUser = localStorage.getItem("condwriteCurrentUser") || "";
  }
  catch(error){
    /* ignore */
  }

  if(currentUser && allAccounts[currentUser]){

    delete allAccounts[currentUser];

    saveAccounts();

  }

  try{
    localStorage.removeItem("condwriteCurrentUser");
    localStorage.removeItem("aiAppBuilderCode");
    localStorage.removeItem("aiAppBuilderSavedAt");
  }
  catch(error){
    /* ignore */
  }

  registeredName = "";
  registeredPasswordHash = "";

}

function showChangeNameForm(){

  const newName = prompt("Enter new name:", registeredName);

  if(!newName || newName.trim().length < 2){
    showToast("Name must be at least 2 characters");
    return;
  }

  const trimmedName = newName.trim();

  loadAccounts();

  const currentUser = localStorage.getItem("condwriteCurrentUser") || "";

  if(!currentUser || !allAccounts[currentUser]){
    showToast("No current account");
    return;
  }

  const oldHash = allAccounts[currentUser].passwordHash;

  const newKey = trimmedName + "_" + oldHash;

  if(allAccounts[newKey] && newKey !== currentUser){
    showToast("Account with this name and password already exists");
    return;
  }

  allAccounts[newKey] = {
    name: trimmedName,
    passwordHash: oldHash,
    code: allAccounts[currentUser].code || defaultCode,
    createdAt: allAccounts[currentUser].createdAt || new Date().toISOString()
  };

  delete allAccounts[currentUser];

  saveAccounts();

  localStorage.setItem("condwriteCurrentUser", newKey);

  registeredName = trimmedName;

  showToast("✓ Name changed to " + trimmedName);

}

function showChangePasswordForm(){

  const currentPassword = prompt("Enter current password:");

  if(!currentPassword){
    return;
  }

  const currentHash = simpleHash(currentPassword);

  if(currentHash !== registeredPasswordHash){
    showToast("Current password is incorrect");
    return;
  }

  const newPassword = prompt("Enter new password:");

  if(!newPassword){
    return;
  }

  const requirements = checkPasswordRequirements(newPassword);

  if(!requirements.length){
    showToast("Password must be at least 8 characters");
    return;
  }

  if(!requirements.upper){
    showToast("Password must contain uppercase letter (A-Z)");
    return;
  }

  if(!requirements.lower){
    showToast("Password must contain lowercase letter (a-z)");
    return;
  }

  if(!requirements.number){
    showToast("Password must contain number (0-9)");
    return;
  }

  if(!requirements.special){
    showToast("Password must contain special character");
    return;
  }

  const confirmPassword = prompt("Confirm new password:");

  if(newPassword !== confirmPassword){
    showToast("Passwords do not match");
    return;
  }

  const newHash = simpleHash(newPassword);

  loadAccounts();

  const currentUser = localStorage.getItem("condwriteCurrentUser") || "";

  if(!currentUser || !allAccounts[currentUser]){
    showToast("No current account");
    return;
  }

  const newKey = registeredName + "_" + newHash;

  if(allAccounts[newKey] && newKey !== currentUser){
    showToast("Account with this name and password already exists");
    return;
  }

  allAccounts[newKey] = {
    name: registeredName,
    passwordHash: newHash,
    code: allAccounts[currentUser].code || defaultCode,
    createdAt: allAccounts[currentUser].createdAt || new Date().toISOString()
  };

  delete allAccounts[currentUser];

  saveAccounts();

  localStorage.setItem("condwriteCurrentUser", newKey);

  registeredPasswordHash = newHash;

  showToast("✓ Password changed successfully");

}
