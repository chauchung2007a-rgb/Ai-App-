<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AI App Builder</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#f5f5f7;
  color:#111;
}


/* =====================================================
   APP
===================================================== */

.app{
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  background:#fff;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  height:92px;
  flex-shrink:0;
  background:#fff;
  border-bottom:1px solid #e5e5e7;
}

.top-row{
  height:43px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
}

.home-btn,
.settings-btn{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:#f1f1f3;
  color:#111;
  font-size:18px;
  cursor:pointer;
}

.title{
  font-size:15px;
  font-weight:700;
}

.tabs{
  height:49px;
  display:flex;
  align-items:center;
  justify-content:space-around;
}

.tab{
  height:38px;
  min-width:82px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#777;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.tab.active{
  background:#111;
  color:#fff;
}


/* =====================================================
   MAIN
===================================================== */

.main{
  flex:1;
  min-height:0;
  position:relative;
}

.view{
  position:absolute;
  inset:0;
  display:none;
}

.view.active{
  display:flex;
}


/* =====================================================
   CHAT
===================================================== */

.chat-view{
  flex-direction:column;
  background:#fff;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:20px 14px 22px;
}

.welcome{
  max-width:330px;
  margin:50px auto 0;
  text-align:center;
}

.welcome-icon{
  width:58px;
  height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 16px;
  border-radius:18px;
  background:#111;
  color:#fff;
  font-size:28px;
}

.welcome h2{
  font-size:22px;
  margin-bottom:8px;
}

.welcome p{
  color:#777;
  font-size:14px;
  line-height:1.6;
}

.message{
  max-width:86%;
  margin-bottom:15px;
  padding:11px 14px;
  border-radius:18px;
  font-size:14px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.message.user{
  margin-left:auto;
  background:#111;
  color:#fff;
  border-bottom-right-radius:5px;
}

.message.ai{
  margin-right:auto;
  background:#f1f1f3;
  color:#111;
  border-bottom-left-radius:5px;
}


/* =====================================================
   CHAT INPUT
   រូបរាងប្រហាក់ប្រហែល ChatGPT
===================================================== */

.chat-input-area{
  flex-shrink:0;
  padding:8px 10px 13px;
  background:#fff;
  border-top:1px solid #eeeeef;
}

.attachment-name{
  display:none;
  padding:4px 8px;
  color:#666;
  font-size:11px;
}


/* ជួរទាំងមូល */

.input-row{
  width:100%;
  display:flex;
  align-items:flex-end;
  gap:7px;
}


/* =====================================================
   CHATGPT STYLE INPUT BOX
===================================================== */

.chat-box{
  flex:1;
  min-width:0;
  min-height:52px;
  max-height:120px;

  display:flex;
  align-items:flex-end;

  padding:6px 7px 6px 8px;

  background:#f1f1f3;
  border:1px solid #e1e1e4;
  border-radius:27px;

  transition:
    border-color .2s ease,
    background .2s ease;
}

.chat-box:focus-within{
  border-color:#c9c9cd;
  background:#eeeeef;
}


/* =====================================================
   + BUTTON
===================================================== */

.plus-btn{
  width:38px;
  height:38px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  background:transparent;

  color:#111;
  font-size:30px;
  font-weight:300;
  line-height:1;

  cursor:pointer;
}


/* =====================================================
   TEXTAREA
===================================================== */

.chat-input{
  flex:1;
  min-width:0;

  min-height:38px;
  max-height:105px;

  resize:none;
  overflow-y:auto;

  border:0;
  outline:0;

  padding:9px 6px;

  background:transparent;
  color:#111;

  font-size:16px;
  line-height:20px;

  font-family:inherit;
}

.chat-input::placeholder{
  color:#8b8b8f;
}


/* =====================================================
   ATTACHMENT BUTTON
   📎 នៅកន្លែងដែលបានស្នើ
===================================================== */

.attach-inside-btn{
  width:38px;
  height:38px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  background:transparent;

  color:#111;
  font-size:21px;

  cursor:pointer;
}


/* =====================================================
   MICROPHONE
   រាងមូលដូច ChatGPT
===================================================== */

.voice-inside-btn{
  width:39px;
  height:39px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  background:transparent;

  color:#111;

  cursor:pointer;
}


/* SVG microphone */

.voice-inside-btn svg{
  width:25px;
  height:25px;
  display:block;
}


/* =====================================================
   SEND BUTTON
===================================================== */

.send-btn{
  width:50px;
  height:50px;
  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:center;

  border:0;
  border-radius:50%;

  background:#111;
  color:#fff;

  cursor:pointer;
}

.send-btn svg{
  width:23px;
  height:23px;
  display:block;
}


/* =====================================================
   SETTINGS
===================================================== */

.settings-panel{
  position:absolute;
  z-index:100;
  top:44px;
  right:10px;
  width:240px;
  padding:7px;
  display:none;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  box-shadow:0 12px 35px rgba(0,0,0,.16);
}

.settings-panel.show{
  display:block;
}

.setting-item{
  width:100%;
  min-height:43px;
  border:0;
  border-radius:10px;
  background:#fff;
  color:#111;
  text-align:left;
  padding:9px 11px;
  font-size:13px;
  cursor:pointer;
}

.setting-item:active{
  background:#f1f1f3;
}

.setting-item + .setting-item{
  margin-top:2px;
}


/* =====================================================
   TOAST
===================================================== */

.toast{
  position:fixed;
  z-index:9999;
  left:50%;
  bottom:78px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  min-width:190px;
  max-width:90%;
  padding:11px 16px;
  border-radius:12px;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:13px;
  transition:.25s ease;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}


/* =====================================================
   CODE
===================================================== */

.code-view{
  flex-direction:column;
  background:#111318;
}

.code-toolbar{
  height:52px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:6px;
  padding:7px;
  background:#181b21;
  border-bottom:1px solid #292d35;
}

.language-select,
.tool-btn{
  height:36px;
  border:1px solid #343943;
  border-radius:9px;
  background:#20242c;
  color:#fff;
  font-size:12px;
}

.language-select{
  padding:0 7px;
  max-width:82px;
}

.tool-btn{
  padding:0 9px;
  cursor:pointer;
}

.code-editor-wrap{
  flex:1;
  min-height:0;
  display:flex;
  overflow:hidden;
  background:#111318;
}

.line-numbers{
  width:42px;
  flex-shrink:0;
  overflow:hidden;
  padding-top:13px;
  padding-right:8px;
  border-right:1px solid #292d35;
  background:#181b21;
  color:#656b77;
  text-align:right;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  user-select:none;
}

.editor-container{
  position:relative;
  flex:1;
  min-width:0;
  overflow:hidden;
}

.highlight{
  position:absolute;
  inset:0;
  margin:0;
  padding:13px;
  overflow:auto;
  pointer-events:none;
  white-space:pre;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  color:#ddd;
}

.code-editor{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  resize:none;
  border:0;
  outline:0;
  padding:13px;
  overflow:auto;
  white-space:pre;
  font-family:monospace;
  font-size:13px;
  line-height:1.55;
  background:transparent;
  color:transparent;
  caret-color:#fff;
  -webkit-text-fill-color:transparent;
  tab-size:2;
}

.code-editor::selection{
  background:rgba(100,140,200,.4);
}

.c-comment{
  color:#6a9955;
}

.c-tag{
  color:#569cd6;
}

.c-attr{
  color:#9cdcfe;
}

.c-string{
  color:#ce9178;
}

.c-keyword{
  color:#c586c0;
}

.c-number{
  color:#b5cea8;
}

.c-property{
  color:#9cdcfe;
}

.c-value{
  color:#ce9178;
}

.copy-range{
  flex-shrink:0;
  padding:8px;
  background:#181b21;
  border-top:1px solid #292d35;
}

.range-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.range-label{
  color:#a0a5ae;
  font-size:11px;
}

.range-input{
  width:55px;
  height:34px;
  border:1px solid #343943;
  border-radius:8px;
  outline:none;
  background:#20242c;
  color:#fff;
  text-align:center;
}

.copy-range-btn{
  height:34px;
  border:0;
  border-radius:8px;
  padding:0 10px;
  background:#fff;
  color:#111;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
}


/* =====================================================
   APP PREVIEW
===================================================== */

.preview-view{
  flex-direction:column;
  align-items:center;
  overflow:auto;
  padding:12px 10px 24px;
  background:#f2f2f4;
}

.preview-toolbar{
  width:100%;
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.test-app-btn{
  height:42px;
  border:0;
  border-radius:12px;
  padding:0 20px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
}

.phone{
  position:relative;
  width:min(330px,88vw);
  height:min(675px,calc(100vh - 140px));
  min-height:500px;
  padding:9px;
  border:2px solid #c7c9ce;
  border-radius:43px;
  background:#fafafa;
  box-shadow:
    0 15px 40px rgba(0,0,0,.22);
}

.phone-screen{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  border-radius:34px;
  background:#fff;
}

.preview-frame{
  display:block;
  width:100%;
  height:100%;
  border:0;
  background:#fff;
}


/* =====================================================
   SCROLLBAR
===================================================== */

::-webkit-scrollbar{
  width:5px;
  height:5px;
}

::-webkit-scrollbar-thumb{
  background:#777;
  border-radius:10px;
}


@media(max-width:360px){

  .tab{
    min-width:70px;
    font-size:12px;
  }

  .tool-btn{
    padding:0 6px;
  }

  .send-btn{
    width:46px;
    height:46px;
  }

}

</style>
</head>


<body>

<div class="app">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="top-row">

    <button
      class="home-btn"
      id="homeBtn"
      type="button"
    >🏠</button>

    <div class="title">
      AI App Builder
    </div>

    <button
      class="settings-btn"
      id="settingsBtn"
      type="button"
    >⚙️</button>

  </div>


  <div class="tabs">

    <button
      class="tab active"
      id="aiTab"
      type="button"
    >🤖 AI</button>

    <button
      class="tab"
      id="codeTab"
      type="button"
    >&lt;/&gt; កូដ</button>

    <button
      class="tab"
      id="appTab"
      type="button"
    >📱 App</button>

  </div>

</header>


<!-- =====================================================
     SETTINGS
===================================================== -->

<div
  class="settings-panel"
  id="settingsPanel"
>

  <button
    class="setting-item"
    id="settingsCopy"
    type="button"
  >📎 Copy Code</button>


  <button
    class="setting-item"
    id="undoBtn"
    type="button"
  >↶ Undo</button>


  <button
    class="setting-item"
    id="redoBtn"
    type="button"
  >↷ Redo</button>


  <button
    class="setting-item"
    id="testBtn"
    type="button"
  >▶ Test Project</button>


  <button
    class="setting-item"
    id="saveBtn"
    type="button"
  >💾 Save Project</button>


  <button
    class="setting-item"
    id="deleteCodeBtn"
    type="button"
  >🗑️ លុបកូដ</button>


  <button
    class="setting-item"
    id="deleteChatBtn"
    type="button"
  >🗑 Delete Chat</button>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


<!-- =====================================================
     AI CHAT
===================================================== -->

<section
  class="view chat-view active"
  id="chatView"
>

  <div
    class="chat-messages"
    id="chatMessages"
  >

    <div class="welcome">

      <div class="welcome-icon">
        🤖
      </div>

      <h2>
        AI App Builder
      </h2>

      <p>
        ប្រាប់ AI ថាអ្នកចង់បង្កើត App អ្វី
        <br>
        អ្នកអាចសរសេរ ឬនិយាយបាន
      </p>

    </div>

  </div>


  <div class="chat-input-area">

    <div
      class="attachment-name"
      id="attachmentName"
    ></div>


    <div class="input-row">


      <!-- FILE -->

      <input
        type="file"
        id="fileInput"
        hidden
        accept="image/*,.txt,.html,.css,.js,.json,.pdf"
      >


      <!-- CHAT BOX -->

      <div class="chat-box">


        <!-- PLUS -->

        <button
          class="plus-btn"
          id="plusBtn"
          type="button"
        >+</button>


        <!-- PAPERCLIP -->

        <button
          class="attach-inside-btn"
          id="attachBtn"
          type="button"
          aria-label="Attach"
        >📎</button>


        <!-- TEXT -->

        <textarea
          class="chat-input"
          id="chatInput"
          rows="1"
          placeholder="Ask Ai"
          autocomplete="off"
        ></textarea>


        <!-- MICROPHONE -->

        <button
          class="voice-inside-btn"
          id="voiceBtn"
          type="button"
          aria-label="Voice"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

            <rect
              x="8"
              y="2.5"
              width="8"
              height="13"
              rx="4"
              stroke="currentColor"
              stroke-width="2"
            />

            <path
              d="M4.5 11.5V12.5C4.5 16.6421 7.85786 20 12 20C16.1421 20 19.5 16.6421 19.5 12.5V11.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M12 20V22"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

            <path
              d="M8.5 22H15.5"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />

          </svg>

        </button>


      </div>


      <!-- SEND -->

      <button
        class="send-btn"
        id="sendBtn"
        type="button"
        aria-label="Send"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >

          <path
            d="M5 12H19"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
          />

          <path
            d="M13 6L19 12L13 18"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />

        </svg>

      </button>

    </div>

  </div>

</section>


<!-- =====================================================
     CODE
===================================================== -->

<section
  class="view code-view"
  id="codeView"
>

  <div class="code-toolbar">

    <select
      class="language-select"
      id="languageSelect"
    >

      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="javascript">JS</option>
      <option value="json">JSON</option>

    </select>


    <button
      class="tool-btn"
      id="copyAllBtn"
      type="button"
    >📎 Copy All</button>


    <button
      class="tool-btn"
      id="runCodeBtn"
      type="button"
    >▶ Run</button>

  </div>


  <div class="code-editor-wrap">

    <div
      class="line-numbers"
      id="lineNumbers"
    >1</div>


    <div class="editor-container">

      <pre
        class="highlight"
        id="highlight"
        aria-hidden="true"
      ><code id="highlighted"></code></pre>


      <textarea
        class="code-editor"
        id="codeEditor"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        autocorrect="off"
      ></textarea>

    </div>

  </div>


  <div class="copy-range">

    <div class="range-row">

      <span class="range-label">
        Copy:
      </span>


      <input
        class="range-input"
        id="startLine"
        type="number"
        min="1"
        value="1"
      >


      <span class="range-label">
        ដល់
      </span>


      <input
        class="range-input"
        id="endLine"
        type="number"
        min="1"
        value="10"
      >


      <button
        class="copy-range-btn"
        id="copyRangeBtn"
        type="button"
      >📎 Copy Range</button>

    </div>

  </div>

</section>


<!-- =====================================================
     APP PREVIEW
===================================================== -->

<section
  class="view preview-view"
  id="previewView"
>

  <div class="preview-toolbar">

    <button
      class="test-app-btn"
      id="testAppBtn"
      type="button"
    >▶ សាកល្បង App</button>

  </div>


  <div class="phone">

    <div class="phone-screen">

      <iframe
        class="preview-frame"
        id="previewFrame"
        title="App Preview"
        sandbox="allow-scripts"
      ></iframe>

    </div>

  </div>

</section>


</main>


<div
  class="toast"
  id="toast"
></div>


</div>


<script>

/* =====================================================
   DEFAULT CODE
===================================================== */

const defaultCode = `<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My App</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#ffffff;
  color:#111111;
  text-align:center;
  padding:40px 20px;
}

h1{
  margin-bottom:20px;
}

button{
  padding:12px 20px;
  border:0;
  border-radius:10px;
  background:#111111;
  color:white;
  cursor:pointer;
}

</style>

</head>

<body>

<h1>My New App</h1>

<p>Hello from my App!</p>

<button onclick="alert('Hello!')">
  Test Button
</button>

</body>

</html>`;


/* =====================================================
   ELEMENTS
===================================================== */

const aiTab =
  document.getElementById("aiTab");

const codeTab =
  document.getElementById("codeTab");

const appTab =
  document.getElementById("appTab");

const chatView =
  document.getElementById("chatView");

const codeView =
  document.getElementById("codeView");

const previewView =
  document.getElementById("previewView");

const chatMessages =
  document.getElementById("chatMessages");

const chatInput =
  document.getElementById("chatInput");

const sendBtn =
  document.getElementById("sendBtn");

const voiceBtn =
  document.getElementById("voiceBtn");

const attachBtn =
  document.getElementById("attachBtn");

const plusBtn =
  document.getElementById("plusBtn");

const fileInput =
  document.getElementById("fileInput");

const attachmentName =
  document.getElementById("attachmentName");

const codeEditor =
  document.getElementById("codeEditor");

const highlight =
  document.getElementById("highlight");

const highlighted =
  document.getElementById("highlighted");

const lineNumbers =
  document.getElementById("lineNumbers");

const languageSelect =
  document.getElementById("languageSelect");

const startLine =
  document.getElementById("startLine");

const endLine =
  document.getElementById("endLine");

const copyRangeBtn =
  document.getElementById("copyRangeBtn");

const copyAllBtn =

/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(
      function(){
        toast.classList.remove("show");
      },
      1800
    );

}


/* =====================================================
   HISTORY
===================================================== */

let history = [];

let future = [];

let historyTimer = null;

let changingHistory = false;


function addHistory(){

  if(changingHistory){
    return;
  }

  const value =
    codeEditor.value;

  if(
    history.length === 0 ||
    history[history.length - 1] !== value
  ){

    history.push(value);

    if(history.length > 100){
      history.shift();
    }

    future = [];

  }

}


function scheduleHistory(){

  clearTimeout(historyTimer);

  historyTimer =
    setTimeout(
      addHistory,
      500
    );

}


function undo(){

  if(history.length <= 1){

    showToast(
      "មិនមានអ្វីសម្រាប់ Undo ទេ"
    );

    return;
  }

  changingHistory = true;

  future.push(
    history.pop()
  );

  codeEditor.value =
    history[history.length - 1];

  changingHistory = false;

  updateCode();

  showToast(
    "✓ Undo បានធ្វើរួច"
  );

}


function redo(){

  if(future.length === 0){

    showToast(
      "មិនមានអ្វីសម្រាប់ Redo ទេ"
    );

    return;
  }

  changingHistory = true;

  const value =
    future.pop();

  history.push(value);

  codeEditor.value =
    value;

  changingHistory = false;

  updateCode();

  showToast(
    "✓ Redo បានធ្វើរួច"
  );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

  return text
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");

}


/* =====================================================
   HTML HIGHLIGHT
===================================================== */

function highlightHTML(code){

  let result =
    escapeHTML(code);

  result =
    result.replace(
      /(&lt;!--[\s\S]*?--&gt;)/g,
      '<span class="c-comment">$1</span>'
    );

  result =
    result.replace(
      /(&lt;\/?)([a-zA-Z][\w-]*)/g,
      '$1<span class="c-tag">$2</span>'
    );

  result =
    result.replace(
      /([\w:-]+)(=)(&quot;.*?&quot;|&#39;.*?&#39;)/g,
      '<span class="c-attr">$1</span>$2<span class="c-string">$3</span>'
    );

  return result;

}


/* =====================================================
   CSS HIGHLIGHT
===================================================== */

function highlightCSS(code){

  let result =
    escapeHTML(code);

  result =
    result.replace(
      /(\/\*[\s\S]*?\*\/)/g,
      '<span class="c-comment">$1</span>'
    );

  result =
    result.replace(
      /([a-zA-Z-]+)(\s*:)/g,
      '<span class="c-property">$1</span>$2'
    );

  return result;

}


/* =====================================================
   JAVASCRIPT HIGHLIGHT
===================================================== */

function highlightJS(code){

  let result =
    escapeHTML(code);

  result =
    result.replace(
      /(\/\/.*$)/gm,
      '<span class="c-comment">$1</span>'
    );

  result =
    result.replace(
      /(&quot;.*?&quot;|&#39;.*?&#39;|`.*?`)/g,
      '<span class="c-string">$1</span>'
    );

  result =
    result.replace(
      /\b(const|let|var|function|return|if|else|for|while|new|class|this|true|false|null|undefined)\b/g,
      '<span class="c-keyword">$1</span>'
    );

  result =
    result.replace(
      /\b\d+(?:\.\d+)?\b/g,
      '<span class="c-number">$1</span>'
    );

  return result;

}


/* =====================================================
   JSON HIGHLIGHT
===================================================== */

function highlightJSON(code){

  let result =
    escapeHTML(code);

  result =
    result.replace(
      /(&quot;.*?&quot;)(\s*:)/g,
      '<span class="c-property">$1</span>$2'
    );

  result =
    result.replace(
      /\b(true|false|null)\b/g,
      '<span class="c-keyword">$1</span>'
    );

  result =
    result.replace(
      /\b\d+(?:\.\d+)?\b/g,
      '<span class="c-number">$1</span>'
    );

  return result;

}


/* =====================================================
   UPDATE SYNTAX
===================================================== */

function updateSyntax(){

  const code =
    codeEditor.value;

  const language =
    languageSelect.value;

  let result = "";

  if(language === "html"){
    result = highlightHTML(code);
  }

  else if(language === "css"){
    result = highlightCSS(code);
  }

  else if(language === "javascript"){
    result = highlightJS(code);
  }

  else{
    result = highlightJSON(code);
  }

  highlighted.innerHTML =
    result || " ";

}


/* =====================================================
   LINE NUMBERS
===================================================== */

function updateLineNumbers(){

  const total =
    codeEditor.value.split("\n").length;

  let output = "";

  for(
    let i = 1;
    i <= total;
    i++
  ){

    output +=
      i + "<br>";

  }

  lineNumbers.innerHTML =
    output;

  startLine.max =
    total;

  endLine.max =
    total;

  if(
    Number(endLine.value) > total
  ){

    endLine.value =
      total;

  }

}


/* =====================================================
   SCROLL
===================================================== */

function syncScroll(){

  highlight.scrollTop =
    codeEditor.scrollTop;

  highlight.scrollLeft =
    codeEditor.scrollLeft;

  lineNumbers.scrollTop =
    codeEditor.scrollTop;

}


/* =====================================================
   UPDATE CODE
===================================================== */

function updateCode(){

  updateSyntax();

  updateLineNumbers();

  syncScroll();

}


/* =====================================================
   TAB KEY
===================================================== */

codeEditor.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Tab"){

      event.preventDefault();

      const start =
        this.selectionStart;

      const end =
        this.selectionEnd;

      this.value =
        this.value.substring(0,start)
        + "  "
        + this.value.substring(end);

      this.selectionStart =
        this.selectionEnd =
        start + 2;

      updateCode();

      scheduleHistory();

    }

  }
);

/* =====================================================
   COPY
===================================================== */

async function copyText(text){

  try{

    await navigator.clipboard.writeText(text);

    showToast(
      "✓ បាន Copy កូដរួចហើយ"
    );

  }

  catch(error){

    const temp =
      document.createElement("textarea");

    temp.value =
      text;

    document.body.appendChild(temp);

    temp.select();

    document.execCommand("copy");

    temp.remove();

    showToast(
      "✓ បាន Copy កូដរួចហើយ"
    );

  }

}

/* =====================================================
   COPY RANGE
===================================================== */

copyRangeBtn.addEventListener(
  "click",
  function(){

    const lines =
      codeEditor.value.split("\n");

    const start =
      Number(startLine.value);

    const end =
      Number(endLine.value);

    if(
      !Number.isInteger(start) ||
      !Number.isInteger(end) ||
      start < 1 ||
      end < start ||
      start > lines.length
    ){

      showToast(
        "សូមដាក់លេខបន្ទាត់ឱ្យត្រឹមត្រូវ"
      );

      return;
    }

    const finalEnd =
      Math.min(
        end,
        lines.length
      );

    const selected =
      lines
        .slice(start - 1,finalEnd)
        .join("\n");

    copyText(selected);

  }
);

){

    document.createElement("div");

    "message " + type;

  message.textContent =
    text;

  chatMessages.appendChild(
    message
  );

  chatMessages.scrollTop =
    chatMessages.scrollHeight;

}


function sendMessage(){

    chatInput.value.trim();

  if(!text){

  addMessage(
    text,
    "user"
  );

  chatInput.value =

    "38px";

    function(){

  );
